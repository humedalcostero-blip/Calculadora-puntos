<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#122033" />
    <meta
      name="description"
      content="Marcador para partidas por rondas, Catán y 7 Wonders con puntuación automática."
    />
    <title>Marcador de Juegos</title>
    <style>
      :root {
        --ink: #122033;
        --muted: #637286;
        --paper: #f7f5ee;
        --panel: #fff;
        --line: #dfe4e8;
        --lime: #c9ff62;
        --shadow: 0 18px 55px rgba(37, 49, 65, 0.08);
      }

      * { box-sizing: border-box; }
      html { background: var(--paper); }
      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 8% 8%, rgba(117, 231, 255, 0.19), transparent 27rem),
          radial-gradient(circle at 93% 30%, rgba(201, 255, 98, 0.18), transparent 25rem),
          var(--paper);
        color: var(--ink);
        font-family: "Avenir Next", Avenir, Montserrat, Inter, system-ui, sans-serif;
      }
      button, input { font: inherit; }
      button { cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: 0.5; }
      .sr-only {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
      }
      .header {
        border-bottom: 1px solid rgba(18,32,51,.1);
        background: rgba(247,245,238,.82);
        backdrop-filter: blur(14px);
      }
      .header-inner {
        width: min(1180px, calc(100% - 2rem)); min-height: 72px; margin: 0 auto;
        display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      }
      .brand { display: flex; align-items: center; gap: .65rem; font-size: .82rem; font-weight: 950; letter-spacing: .16em; }
      .brand-dot { width: 16px; height: 16px; border: 4px solid var(--ink); border-radius: 50%; box-shadow: 6px 0 0 -2px var(--lime); }
      .round-pill, .badge {
        display: inline-flex; align-items: center; gap: .45rem; border: 1px solid var(--line);
        border-radius: 999px; background: rgba(255,255,255,.83); color: var(--muted);
        font-size: .75rem; font-weight: 850; padding: .5rem .8rem;
      }
      .shell { width: min(1180px, calc(100% - 2rem)); margin: 0 auto; padding: clamp(2.5rem, 7vw, 5.5rem) 0 4rem; }
      .heading { max-width: 760px; margin-bottom: clamp(2rem, 5vw, 3.5rem); }
      .eyebrow { margin: 0 0 .8rem; color: #496075; font-size: .75rem; font-weight: 950; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(2.7rem, 7vw, 5.9rem); font-weight: 950; letter-spacing: -.07em; line-height: .96; }
      .heading > p:last-child { margin: 1.25rem 0 0; color: var(--muted); font-size: clamp(1rem, 2vw, 1.18rem); }
      .grid { display: grid; grid-template-columns: minmax(0,1.45fr) minmax(300px,.75fr); gap: 1.25rem; align-items: stretch; }
      .panel { border: 1px solid rgba(18,32,51,.11); border-radius: 24px; background: rgba(255,255,255,.93); box-shadow: var(--shadow); padding: clamp(1.2rem,3vw,2rem); }
      .panel-head, .history-head, .game-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
      .step { margin: 0 0 .4rem; color: #708095; font-size: .68rem; font-weight: 950; letter-spacing: .14em; }
      h2 { margin: 0; font-size: clamp(1.35rem,2.3vw,1.8rem); font-weight: 900; letter-spacing: -.035em; }
      .count { background: var(--ink); color: #fff; border-color: var(--ink); }
      .add-form { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: .75rem; margin: 1.5rem 0; }
      input {
        width: 100%; height: 48px; border: 1px solid #d9dfe4; border-radius: 12px;
        background: #fff; color: var(--ink); padding: 0 1rem; outline: none;
      }
      input:focus { border-color: #637286; box-shadow: 0 0 0 3px rgba(99,114,134,.18); }
      .btn {
        min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
        border: 1px solid var(--ink); border-radius: 12px; background: var(--ink); color: #fff;
        padding: .7rem 1rem; font-weight: 850; transition: transform .14s ease, background .14s ease;
      }
      .btn:hover:not(:disabled) { background: #263a52; }
      .btn:active:not(:disabled) { transform: translateY(1px); }
      .btn-secondary { border-color: var(--line); background: #fff; color: var(--ink); }
      .btn-secondary:hover:not(:disabled) { background: #f0f3f5; }
      .btn-ghost { border-color: transparent; background: transparent; color: var(--ink); }
      .btn-ghost:hover:not(:disabled) { background: #eef1f3; }
      .player-list { display: grid; gap: .65rem; }
      .empty { min-height: 160px; display: grid; place-items: center; align-content: center; gap: .35rem; border: 1px dashed #c8d0d8; border-radius: 17px; background: #fafbfb; color: var(--muted); text-align: center; }
      .empty strong { color: var(--ink); }
      .player { min-width: 0; display: grid; grid-template-columns: auto minmax(0,1fr) auto auto; align-items: center; gap: .8rem; border: 1px solid #e5e8eb; border-radius: 15px; padding: .65rem .75rem; }
      .avatar { width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; border: 2px solid rgba(18,32,51,.78); border-radius: 12px; color: var(--ink); font-size: .7rem; font-weight: 950; box-shadow: 2px 2px 0 rgba(18,32,51,.82); }
      .player-name { overflow: hidden; font-weight: 850; text-overflow: ellipsis; white-space: nowrap; }
      .player-number { color: #9aa5b0; font-size: .74rem; font-weight: 850; }
      .remove { width: 34px; min-height: 34px; padding: 0; border: 0; border-radius: 9px; background: transparent; color: #7b8998; font-size: 1rem; }
      .remove:hover { background: #f1f3f4; color: #c83232; }
      .limit-panel { min-height: 100%; display: flex; flex-direction: column; justify-content: space-between; gap: 2rem; background: linear-gradient(145deg,rgba(201,255,98,.25),transparent 46%),rgba(255,255,255,.94); }
      .copy { margin: .8rem 0 0; color: var(--muted); font-size: .9rem; line-height: 1.55; }
      .mode-options { display: grid; gap: .65rem; }
      .mode-option { display: grid; grid-template-columns: auto minmax(0,1fr); align-items: start; gap: .75rem; border: 1px solid #dfe4e8; border-radius: 15px; background: rgba(255,255,255,.78); padding: .85rem; cursor: pointer; transition: border-color .16s ease, background .16s ease; }
      .mode-option:has(input:checked) { border: 2px solid var(--ink); background: #fff; padding: calc(.85rem - 1px); }
      .mode-option input { width: 18px; height: 18px; margin: .15rem 0 0; padding: 0; accent-color: var(--ink); box-shadow: none; }
      .mode-option span { display: grid; gap: .18rem; }
      .mode-option strong { font-size: .87rem; }
      .mode-option small { color: var(--muted); font-size: .75rem; line-height: 1.4; }
      .mode-option.catan-option:has(input:checked) { background: linear-gradient(135deg,rgba(255,177,90,.2),rgba(255,255,255,.95)); }
      .mode-option.seven-option:has(input:checked) { background: linear-gradient(135deg,rgba(117,231,255,.22),rgba(187,165,255,.16),rgba(255,255,255,.95)); }
      .limit-label { display: block; margin-bottom: .55rem; color: #607186; font-size: .72rem; font-weight: 950; letter-spacing: .07em; text-transform: uppercase; }
      .limit-wrap { position: relative; }
      .limit-wrap input { height: 84px; border: 2px solid var(--ink); border-radius: 17px; padding: 0 5rem 0 1.2rem; font-size: 2.2rem; font-weight: 950; letter-spacing: -.04em; }
      .limit-wrap span { position: absolute; top: 50%; right: 1.2rem; transform: translateY(-50%); color: #7b8895; font-size: .73rem; font-weight: 950; }
      .help { margin: .5rem 0 0; color: #8995a1; font-size: .77rem; }
      .cumulative-note { display: flex; align-items: flex-start; gap: .8rem; border: 1px solid rgba(18,32,51,.18); border-radius: 16px; background: rgba(201,255,98,.22); padding: 1rem; }
      .cumulative-note > span { font-size: 1.15rem; }
      .cumulative-note div { display: grid; gap: .2rem; }
      .cumulative-note strong { font-size: .85rem; }
      .cumulative-note small { color: var(--muted); font-size: .75rem; line-height: 1.45; }
      .catan-config { display: grid; gap: 1rem; }
      .catan-config-head { display: flex; align-items: center; justify-content: space-between; gap: .8rem; }
      .catan-config-head strong { font-size: .82rem; }
      .catan-config-head span { border-radius: 999px; background: var(--ink); color: #fff; padding: .35rem .58rem; font-size: .65rem; font-weight: 900; }
      .module-grid { display: grid; gap: .5rem; }
      .module-option { display: grid; grid-template-columns: auto minmax(0,1fr); align-items: start; gap: .65rem; border: 1px solid #dfe4e8; border-radius: 13px; background: rgba(255,255,255,.8); padding: .72rem; cursor: pointer; }
      .module-option:has(input:checked) { border-color: rgba(18,32,51,.55); background: rgba(255,177,90,.17); }
      .module-option input { width: 18px; height: 18px; margin: .1rem 0 0; padding: 0; accent-color: var(--ink); box-shadow: none; }
      .module-option span { display: grid; gap: .14rem; }
      .module-option strong { font-size: .78rem; }
      .module-option small { color: var(--muted); font-size: .69rem; line-height: 1.35; }
      .start { min-height: 56px; border-radius: 16px; font-size: 1rem; }

      .game-shell { padding-top: clamp(2rem,5vw,4rem); }
      .game-head { align-items: flex-end; margin-bottom: 1.75rem; }
      .game-head h1 { font-size: clamp(2.3rem,6vw,4.7rem); }
      .game-actions, .history-actions { display: flex; align-items: center; justify-content: flex-end; gap: .7rem; flex-wrap: wrap; }
      .limit-badge { display: flex; align-items: baseline; gap: .45rem; border: 1px solid var(--line); border-radius: 13px; background: #fff; padding: .65rem .9rem; font-size: 1rem; font-weight: 950; }
      .limit-badge span { color: #7e8a96; font-size: .61rem; letter-spacing: .12em; }
      .limit-badge.cumulative { background: var(--lime); border-color: rgba(18,32,51,.35); }
      .finish { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.25rem; border: 2px solid var(--ink); border-radius: 20px; background: var(--lime); padding: 1.1rem 1.25rem; box-shadow: 5px 5px 0 var(--ink); }
      .finish-icon { width: 54px; height: 54px; display: grid; place-items: center; flex: 0 0 54px; border-radius: 16px; background: var(--ink); color: #fff; font-size: 1.5rem; }
      .finish p, .finish h2, .finish span { margin: 0; }
      .finish p { font-size: .7rem; font-weight: 950; letter-spacing: .1em; text-transform: uppercase; }
      .finish h2 { margin: .1rem 0; }
      .finish span { font-size: .85rem; }
      .game-grid { display: grid; grid-template-columns: minmax(340px,.8fr) minmax(0,1.2fr); gap: 1.25rem; align-items: start; }
      .panel-head-space { margin-bottom: 1.25rem; }
      .score-list, .ranking { display: grid; gap: .68rem; margin: 0; padding: 0; list-style: none; }
      .score-row { min-width: 0; display: grid; grid-template-columns: auto minmax(0,1fr); align-items: center; gap: .8rem; padding: .55rem; border: 1px solid #e5e8eb; border-radius: 15px; }
      .score-row label { overflow: hidden; font-weight: 850; text-overflow: ellipsis; white-space: nowrap; }
      .score-controls { grid-column: 1/-1; display: grid; grid-template-columns: minmax(0,1fr) 104px; gap: .55rem; align-items: center; }
      .score-operation { display: grid; grid-template-columns: .8fr 1.2fr; gap: .25rem; border: 1px solid #e0e5e9; border-radius: 11px; background: #f3f5f6; padding: .2rem; }
      .operation-btn { min-width: 0; height: 34px; border: 0; border-radius: 8px; background: transparent; color: #667588; padding: 0 .45rem; font-size: .7rem; font-weight: 850; }
      .operation-btn.active[data-operation="add"] { background: var(--ink); color: #fff; }
      .operation-btn.active[data-operation="subtract"] { background: #ffe4e4; color: #a52f2f; }
      .score-input { position: relative; }
      .score-input input { height: 42px; border-radius: 10px; background: #f5f7f8; padding-right: 2.45rem; text-align: right; font-weight: 950; }
      .score-input span { position: absolute; right: .65rem; top: 50%; transform: translateY(-50%); color: #9aa5af; font-size: .64rem; font-weight: 850; }
      .save { width: 100%; min-height: 52px; margin-top: 1.2rem; font-size: 1rem; }
      .rank-row { display: grid; grid-template-columns: 25px auto minmax(0,1fr); align-items: center; gap: .85rem; border: 1px solid #e5e8eb; border-radius: 16px; padding: .8rem; }
      .rank-row:first-child { border-color: rgba(18,32,51,.35); background: linear-gradient(90deg,rgba(201,255,98,.18),transparent 60%); }
      .rank-row.reached { border: 2px solid var(--ink); }
      .rank-no { color: #8a96a1; font-size: .8rem; font-weight: 950; text-align: center; }
      .rank-main { min-width: 0; }
      .rank-line { display: flex; justify-content: space-between; gap: .75rem; margin-bottom: .55rem; }
      .rank-line strong { overflow: hidden; font-size: .9rem; text-overflow: ellipsis; white-space: nowrap; }
      .rank-line span { flex: 0 0 auto; font-weight: 950; }
      .rank-line small { color: #8a96a1; font-size: .63rem; }
      .track { height: 5px; overflow: hidden; border-radius: 999px; background: #e8ecef; }
      .track span { display: block; height: 100%; border-radius: inherit; transition: width .25s ease; }
      .history { margin-top: 1.25rem; overflow: hidden; }
      .history-head { margin-bottom: 1.25rem; }
      .table-wrap { width: 100%; overflow-x: auto; }
      table { width: 100%; min-width: 560px; border-collapse: collapse; font-size: .88rem; }
      th, td { border-bottom: 1px solid #e3e7ea; padding: .85rem 1rem; text-align: center; }
      th:first-child, td:first-child { text-align: left; }
      th { background: #f2f4f5; color: #607084; font-size: .71rem; font-weight: 950; }
      td { font-weight: 800; }
      tfoot { background: var(--ink); color: #fff; }
      tfoot td { border: 0; }
      .round-cell { color: #7c8996; font-size: .74rem; font-weight: 950; }
      .score-negative { color: #bd3333; }
      .catan-threat { margin-bottom: 1.25rem; padding: 1.25rem; }
      .threat-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: .75rem; }
      .threat-metric { min-height: 116px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #e2e6e9; border-radius: 17px; background: #f8f9f9; padding: 1rem; }
      .threat-metric > span { color: #6b7a8c; font-size: .69rem; font-weight: 950; letter-spacing: .08em; text-transform: uppercase; }
      .threat-metric strong { font-size: 2.35rem; line-height: 1; letter-spacing: -.06em; }
      .threat-metric small { color: var(--muted); font-size: .72rem; }
      .threat-status { border: 2px solid var(--ink); }
      .threat-status.safe { background: var(--lime); }
      .threat-status.danger { background: #ffe0d5; }
      .threat-status strong { font-size: 1.15rem; letter-spacing: -.03em; }
      .threat-actions { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-top: 1rem; color: var(--muted); font-size: .75rem; line-height: 1.45; }
      body.modal-open { overflow: hidden; }
      .catan-summary { padding: 1.25rem; }
      .catan-summary-copy { margin: .45rem 0 0; color: var(--muted); font-size: .78rem; line-height: 1.45; }
      .catan-summary-list { display: grid; gap: .6rem; margin-top: 1rem; }
      .catan-summary-row { width: 100%; min-width: 0; display: grid; grid-template-columns: 28px auto minmax(0,1fr) auto auto; align-items: center; gap: .8rem; border: 1px solid #e0e5e8; border-radius: 16px; background: #fff; color: var(--ink); padding: .75rem; text-align: left; transition: transform .14s ease, border-color .14s ease, background .14s ease; }
      .catan-summary-row:hover { transform: translateY(-1px); border-color: #8d99a4; background: #fafcf7; }
      .catan-summary-row:first-child { border-color: rgba(18,32,51,.38); background: linear-gradient(90deg,rgba(201,255,98,.18),#fff 58%); }
      .catan-summary-row.winner { border: 2px solid var(--ink); background: linear-gradient(90deg,rgba(201,255,98,.34),#fff 62%); }
      .catan-summary-rank { color: #8592a0; font-size: .72rem; font-weight: 950; text-align: center; }
      .catan-summary-main { min-width: 0; display: grid; gap: .2rem; }
      .catan-summary-main strong { overflow: hidden; font-size: .92rem; text-overflow: ellipsis; white-space: nowrap; }
      .catan-summary-main small { overflow: hidden; color: var(--muted); font-size: .67rem; line-height: 1.35; text-overflow: ellipsis; white-space: nowrap; }
      .catan-summary-total { min-width: 70px; display: grid; justify-items: end; line-height: 1; }
      .catan-summary-total strong { font-size: 1.55rem; letter-spacing: -.05em; }
      .catan-summary-total small { margin-top: .15rem; color: var(--muted); font-size: .59rem; font-weight: 900; text-transform: uppercase; }
      .catan-summary-open { border-radius: 9px; background: var(--ink); color: #fff; padding: .5rem .65rem; font-size: .66rem; font-weight: 900; }
      .catan-summary-row.pending { border-color: rgba(18,32,51,.42); }
      .catan-summary-open.pending { background: var(--lime); color: var(--ink); }
      .seven-note { display: flex; align-items: flex-start; gap: .8rem; border: 1px solid rgba(18,32,51,.18); border-radius: 16px; background: linear-gradient(135deg,rgba(117,231,255,.19),rgba(187,165,255,.13)); padding: 1rem; }
      .seven-note > span { font-size: 1.15rem; }
      .seven-note div { display: grid; gap: .2rem; }
      .seven-note strong { font-size: .85rem; }
      .seven-note small { color: var(--muted); font-size: .75rem; line-height: 1.45; }
      .seven-science-result { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 1rem; align-items: center; border: 1px solid #d9e1e5; border-radius: 15px; background: #f4fbf7; padding: .85rem 1rem; }
      .seven-science-result span { color: var(--muted); font-size: .7rem; line-height: 1.45; }
      .seven-science-result strong { font-size: 1.6rem; letter-spacing: -.04em; }
      .round-save-bar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-top: 1rem; border-radius: 16px; background: #f1f4f5; padding: .8rem; }
      .round-save-bar div { display: grid; gap: .12rem; }
      .round-save-bar strong { font-size: .8rem; }
      .round-save-bar small { color: var(--muted); font-size: .68rem; }
      .score-editor-current { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 1rem; border: 2px solid var(--ink); border-radius: 17px; background: linear-gradient(135deg,rgba(201,255,98,.24),#fff 58%); padding: 1rem; }
      .score-editor-current span { color: var(--muted); font-size: .69rem; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; }
      .score-editor-current strong { font-size: 2.1rem; letter-spacing: -.06em; }
      .score-editor-form { display: grid; gap: 1rem; margin-top: 1rem; }
      .score-editor-form .score-operation { grid-template-columns: 1fr 1fr; }
      .score-editor-form .operation-btn { height: 46px; font-size: .78rem; }
      .score-editor-input { position: relative; }
      .score-editor-input input { height: 92px; border: 2px solid var(--ink); border-radius: 17px; padding: 0 4rem 0 1rem; font-size: 2.2rem; font-weight: 950; text-align: right; }
      .score-editor-input span { position: absolute; top: 50%; right: 1.1rem; transform: translateY(-50%); color: var(--muted); font-size: .72rem; font-weight: 900; }
      .score-editor-help { margin: 0; color: var(--muted); font-size: .74rem; line-height: 1.45; }
      .catan-modal { position: fixed; z-index: 50; inset: 0; display: grid; place-items: center; background: rgba(11,22,37,.68); padding: 1rem; backdrop-filter: blur(5px); }
      .catan-dialog { width: min(720px,100%); max-height: calc(100dvh - 2rem); overflow-y: auto; overscroll-behavior: contain; border: 1px solid rgba(18,32,51,.25); border-radius: 24px; background: #fff; box-shadow: 0 26px 80px rgba(0,0,0,.28); }
      .catan-dialog-head { position: sticky; z-index: 2; top: 0; display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: center; gap: .8rem; border-bottom: 1px solid #e4e8eb; background: rgba(255,255,255,.96); padding: 1rem 1.15rem; backdrop-filter: blur(10px); }
      .catan-dialog-head h2 { overflow: hidden; font-size: 1.25rem; text-overflow: ellipsis; white-space: nowrap; }
      .catan-dialog-head p { margin: .15rem 0 0; color: var(--muted); font-size: .69rem; font-weight: 800; }
      .catan-dialog-close { width: 38px; height: 38px; border: 0; border-radius: 11px; background: #eef1f3; color: var(--ink); font-size: 1.2rem; font-weight: 900; }
      .catan-editor-body { padding: 1.15rem; }
      .catan-dialog-foot { position: sticky; z-index: 2; bottom: 0; display: flex; align-items: center; justify-content: space-between; gap: 1rem; border-top: 1px solid #e4e8eb; background: rgba(255,255,255,.96); padding: .85rem 1.15rem; backdrop-filter: blur(10px); }
      .catan-dialog-foot span { color: var(--muted); font-size: .7rem; font-weight: 800; }
      .catan-player-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 1rem; }
      .catan-card { padding: 1.1rem; }
      .catan-card-head { display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: center; gap: .8rem; margin-bottom: 1rem; }
      .catan-card-head h2 { overflow: hidden; font-size: 1.2rem; text-overflow: ellipsis; white-space: nowrap; }
      .catan-card-head p { margin: .15rem 0 0; color: var(--muted); font-size: .7rem; font-weight: 800; }
      .catan-rank { color: #7f8d9b; font-size: .72rem; font-weight: 950; }
      .catan-score { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: .8rem; border: 2px solid var(--ink); border-radius: 16px; background: linear-gradient(135deg,rgba(201,255,98,.24),#fff 55%); padding: .8rem; }
      .catan-score span { display: grid; gap: .1rem; color: var(--muted); font-size: .68rem; font-weight: 900; text-transform: uppercase; }
      .catan-score strong { color: var(--ink); font-size: 2rem; line-height: 1; }
      .catan-score-result { display: flex; align-items: baseline; gap: .25rem; font-size: .75rem; font-weight: 900; }
      .catan-score-result strong { font-size: 2rem; }
      .catan-breakdown { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .6rem; }
      .catan-breakdown span { border-radius: 999px; background: #edf1f3; color: #526174; padding: .32rem .52rem; font-size: .62rem; font-weight: 850; }
      .mini-section { margin-top: 1rem; }
      .mini-section-title { display: flex; align-items: center; justify-content: space-between; gap: .8rem; margin-bottom: .55rem; }
      .mini-section-title strong { font-size: .75rem; letter-spacing: .07em; text-transform: uppercase; }
      .mini-section-title span { color: var(--muted); font-size: .7rem; }
      .catan-fields { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: .5rem; }
      .catan-fields.knights { grid-template-columns: repeat(3,minmax(0,1fr)); }
      .catan-field { min-width: 0; border: 1px solid #e2e6e9; border-radius: 13px; background: #f8f9f9; padding: .6rem; }
      .catan-field > span { display: block; min-height: 28px; color: #657488; font-size: .66rem; font-weight: 850; line-height: 1.25; }
      .catan-field > small { display: block; margin-top: .12rem; color: #98a2ac; font-size: .6rem; }
      .stepper { display: grid; grid-template-columns: 30px minmax(24px,1fr) 30px; align-items: center; gap: .2rem; margin-top: .45rem; }
      .stepper button { width: 30px; height: 30px; border: 0; border-radius: 8px; background: var(--ink); color: #fff; font-size: 1rem; font-weight: 950; }
      .stepper output { color: var(--ink); font-size: 1.05rem; font-weight: 950; text-align: center; }
      .seven-stepper { grid-template-columns: 30px 30px minmax(24px,1fr) 30px 30px; }
      .seven-stepper button:first-child, .seven-stepper button:last-child { background: #e5eaed; color: var(--ink); font-size: .65rem; }
      .catan-toggles { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: .5rem; }
      .catan-toggle { min-width: 0; display: grid; grid-template-columns: auto minmax(0,1fr); align-items: center; gap: .6rem; border: 1px solid #e2e6e9; border-radius: 13px; background: #f8f9f9; padding: .65rem; cursor: pointer; }
      .catan-toggle:has(input:checked) { border-color: var(--ink); background: rgba(201,255,98,.22); }
      .catan-toggle input { width: 19px; height: 19px; margin: 0; padding: 0; accent-color: var(--ink); box-shadow: none; }
      .catan-toggle span { display: grid; gap: .1rem; min-width: 0; }
      .catan-toggle strong { font-size: .7rem; line-height: 1.25; }
      .catan-toggle small { color: var(--muted); font-size: .6rem; line-height: 1.25; }
      .empty-history { min-height: 130px; }
      .toast { position: fixed; z-index: 70; top: 1rem; left: 50%; transform: translate(-50%,-140%); max-width: calc(100% - 2rem); border: 1px solid rgba(18,32,51,.15); border-radius: 13px; background: var(--ink); color: #fff; padding: .8rem 1rem; box-shadow: 0 12px 35px rgba(18,32,51,.25); font-size: .86rem; font-weight: 800; opacity: 0; transition: .25s ease; }
      .toast.show { transform: translate(-50%,0); opacity: 1; }

      @media (max-width: 860px) {
        .grid, .game-grid { grid-template-columns: 1fr; }
        .catan-player-grid { grid-template-columns: 1fr; }
        .game-head { align-items: flex-start; flex-direction: column; }
        .game-actions { justify-content: flex-start; }
      }
      @media (max-width: 600px) {
        .header-inner, .shell { width: min(100% - 1.1rem,1180px); }
        .header-inner { min-height: 62px; }
        .brand { font-size: .71rem; }
        .round-pill { padding: .42rem .62rem; font-size: .67rem; }
        h1 { letter-spacing: -.055em; }
        .panel { padding: 1rem; border-radius: 19px; }
        .add-form { grid-template-columns: 1fr; }
        .game-actions, .history-actions { width: 100%; }
        .game-actions > *, .history-actions > * { flex: 1; }
        .limit-badge { justify-content: center; }
        .finish { align-items: flex-start; }
        .finish-icon { width: 44px; height: 44px; flex-basis: 44px; border-radius: 13px; }
        .score-row { grid-template-columns: auto minmax(0,1fr); gap: .6rem; }
        .score-controls { grid-template-columns: minmax(0,1fr) 92px; }
        .avatar { width: 34px; height: 34px; }
        .history-head { align-items: flex-start; flex-direction: column; }
        .threat-grid { grid-template-columns: 1fr 1fr; }
        .threat-status { grid-column: 1/-1; min-height: 92px; }
        .threat-actions { align-items: flex-start; flex-direction: column; }
        .threat-actions .btn { width: 100%; }
        .catan-fields.knights { grid-template-columns: 1fr; }
        .catan-toggles { grid-template-columns: 1fr; }
        .catan-summary-row { grid-template-columns: 24px auto minmax(0,1fr) auto; gap: .6rem; }
        .catan-summary-open { grid-column: 3/-1; justify-self: stretch; text-align: center; }
        .catan-summary-main small { white-space: normal; }
        .round-save-bar { align-items: stretch; flex-direction: column; }
        .round-save-bar .btn { width: 100%; }
        .catan-modal { padding: 0; }
        .catan-dialog { width: 100%; height: 100dvh; max-height: 100dvh; border: 0; border-radius: 0; }
        .catan-dialog-foot { align-items: stretch; flex-direction: column; }
        .catan-dialog-foot .btn { width: 100%; }
      }
      @media (max-width: 380px) {
        .catan-fields { grid-template-columns: 1fr; }
        .mini-section-title { align-items: flex-start; flex-direction: column; gap: .2rem; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="app"></div>

    <script>
      const COLORS = ["#c9ff62", "#75e7ff", "#ffb15a", "#ff7d9c", "#bba5ff", "#f5dd62", "#68d6ae", "#f58bff"];
      const state = {
        phase: "setup",
        players: [],
        mode: "limit",
        limit: 100,
        rounds: [],
        roundDraft: {},
        scoreEditor: null,
        catan: {},
        catanEditor: null,
        catanConfig: { target: 10, seafarers: false, citiesKnights: false, other: false },
        sevenWonders: {},
        sevenWondersEditor: null
      };
      const app = document.querySelector("#app");
      const toastNode = document.querySelector("#toast");
      let toastTimer;

      const escapeHtml = (value) => String(value).replace(/[&<>'"]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[char]));
      const initials = (name) => name.trim().split(/\s+/).slice(0, 2).map(part => part[0]).join("").toUpperCase();
      const format = (number) => new Intl.NumberFormat("es-CL").format(number);
      const uid = () => crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;

      function showToast(message) {
        clearTimeout(toastTimer);
        toastNode.textContent = message;
        toastNode.classList.add("show");
        toastTimer = setTimeout(() => toastNode.classList.remove("show"), 2600);
      }

      function totals() {
        return state.players.reduce((result, player) => {
          result[player.id] = state.rounds.reduce((sum, round) => sum + (round.scores[player.id] || 0), 0);
          return result;
        }, {});
      }

      function ranking() {
        const scoreTotals = totals();
        const players = state.players.map((player, index) => ({ ...player, originalIndex: index, total: scoreTotals[player.id] || 0 }));
        return players.sort((a, b) => state.mode === "cumulative" ? a.total - b.total || a.originalIndex - b.originalIndex : b.total - a.total || a.originalIndex - b.originalIndex);
      }

      function freshRoundDraft() {
        return state.players.reduce((result, player) => {
          result[player.id] = { value: "", operation: "add" };
          return result;
        }, {});
      }

      function draftDelta(playerId) {
        const draft = state.roundDraft[playerId] || { value: "", operation: "add" };
        const parsed = draft.value === "" ? 0 : Math.abs(Number(draft.value));
        const value = Number.isFinite(parsed) ? parsed : 0;
        return draft.operation === "subtract" ? -value : value;
      }

      function freshCatanStats() {
        return state.players.reduce((result, player) => {
          result[player.id] = {
            settlements: 0,
            cities: 0,
            metropolises: 0,
            vpCards: 0,
            longestRoad: false,
            largestArmy: false,
            harborCaptain: false,
            defender: 0,
            merchant: false,
            scenario: 0,
            custom: 0,
            basic: 0,
            strong: 0,
            mighty: 0
          };
          return result;
        }, {});
      }

      function knightStrength(stats) {
        return stats.basic + stats.strong * 2 + stats.mighty * 3;
      }

      function catanScore(stats) {
        const config = state.catanConfig;
        let total = stats.settlements + stats.cities * 2 + stats.vpCards + (stats.longestRoad ? 2 : 0) + (stats.harborCaptain ? 2 : 0) + stats.custom;
        if (!config.citiesKnights && stats.largestArmy) total += 2;
        if (config.citiesKnights) total += stats.metropolises * 2 + stats.defender + (stats.merchant ? 1 : 0);
        if (config.seafarers || config.other) total += stats.scenario;
        return total;
      }

      function catanBreakdown(stats) {
        const parts = [];
        if (stats.settlements) parts.push(`${stats.settlements} poblado${stats.settlements === 1 ? "" : "s"}: ${stats.settlements}`);
        if (stats.cities) parts.push(`${stats.cities} ciudad${stats.cities === 1 ? "" : "es"}: ${stats.cities * 2}`);
        if (stats.vpCards) parts.push(`PV ocultos: ${stats.vpCards}`);
        if (stats.longestRoad) parts.push("Gran ruta: 2");
        if (!state.catanConfig.citiesKnights && stats.largestArmy) parts.push("Mayor ejército: 2");
        if (stats.harborCaptain) parts.push("Capitán del puerto: 2");
        if (state.catanConfig.citiesKnights && stats.metropolises) parts.push(`Metrópolis: ${stats.metropolises * 2}`);
        if (state.catanConfig.citiesKnights && stats.defender) parts.push(`Defensor: ${stats.defender}`);
        if (state.catanConfig.citiesKnights && stats.merchant) parts.push("Mercader: 1");
        if ((state.catanConfig.seafarers || state.catanConfig.other) && stats.scenario) parts.push(`Escenario: ${stats.scenario}`);
        if (stats.custom) parts.push(`Ajuste: ${stats.custom > 0 ? "+" : ""}${stats.custom}`);
        return parts.length ? parts : ["Agrega las piezas del tablero"];
      }

      function freshSevenWondersStats() {
        return state.players.reduce((result, player) => {
          result[player.id] = {
            wonder: 0,
            coins: 0,
            defeat: 0,
            victory1: 0,
            victory3: 0,
            victory5: 0,
            civil: 0,
            commercial: 0,
            guilds: 0,
            scienceTablet: 0,
            scienceGear: 0,
            scienceCompass: 0,
            scienceWild: 0
          };
          return result;
        }, {});
      }

      function sevenScienceResult(stats) {
        const base = [stats.scienceTablet, stats.scienceGear, stats.scienceCompass];
        const wild = stats.scienceWild;
        let best = { score: -Infinity, counts: [...base] };
        for (let tabletWild = 0; tabletWild <= wild; tabletWild += 1) {
          for (let gearWild = 0; gearWild <= wild - tabletWild; gearWild += 1) {
            const compassWild = wild - tabletWild - gearWild;
            const counts = [base[0] + tabletWild, base[1] + gearWild, base[2] + compassWild];
            const score = counts.reduce((sum, count) => sum + count * count, 0) + Math.min(...counts) * 7;
            if (score > best.score) best = { score, counts };
          }
        }
        return best;
      }

      function sevenWondersBreakdown(stats) {
        const science = sevenScienceResult(stats).score;
        const treasury = Math.floor(stats.coins / 3);
        const military = -stats.defeat + stats.victory1 + stats.victory3 * 3 + stats.victory5 * 5;
        return {
          wonder: stats.wonder,
          treasury,
          military,
          civil: stats.civil,
          commercial: stats.commercial,
          science,
          guilds: stats.guilds
        };
      }

      function sevenWondersScore(stats) {
        return Object.values(sevenWondersBreakdown(stats)).reduce((sum, points) => sum + points, 0);
      }

      function avatar(player) {
        return `<span class="avatar" style="background:${player.color}">${escapeHtml(initials(player.name))}</span>`;
      }

      function layout(content, roundText) {
        return `
          <header class="header">
            <div class="header-inner">
              <div class="brand"><span class="brand-dot" aria-hidden="true"></span> MARCADOR</div>
              <div class="round-pill">⚑ ${roundText}</div>
            </div>
          </header>
          ${content}`;
      }

      function setupModeDetails() {
        if (state.mode === "limit") return `<div>
          <label class="limit-label" for="limit">Límite de la partida</label>
          <div class="limit-wrap"><input id="limit" type="number" inputmode="numeric" min="1" step="1" value="${state.limit}" /><span>PTS</span></div>
          <p class="help">Puedes cambiar el límite antes de iniciar.</p>
        </div>`;
        if (state.mode === "cumulative") return `<div class="cumulative-note" role="note"><span aria-hidden="true">♛</span><div><strong>Menor puntaje gana</strong><small>Agrega todas las rondas que necesites. La clasificación se ordenará de menor a mayor.</small></div></div>`;
        if (state.mode === "sevenWonders") return `<div class="seven-note" role="note"><span aria-hidden="true">◈</span><div><strong>Mayor puntaje al final de la Era III</strong><small>Para 3 a 7 jugadores. La ficha suma automáticamente tesorería, conflictos y ciencia. En caso de empate, gana quien conserve más monedas.</small></div></div>`;
        return `<div class="catan-config">
          <div>
            <label class="limit-label" for="catan-target">Puntos para ganar</label>
            <div class="limit-wrap"><input id="catan-target" type="number" inputmode="numeric" min="1" step="1" value="${state.catanConfig.target}" /><span>PV</span></div>
            <p class="help">Catán base suele jugarse a 10 PV y Ciudades y Caballeros a 13. Puedes usar cualquier meta del escenario.</p>
          </div>
          <div>
            <div class="catan-config-head"><strong>Expansiones de esta partida</strong><span>BASE INCLUIDO</span></div>
            <div class="module-grid" style="margin-top:.55rem">
              <label class="module-option"><input type="checkbox" data-catan-module="seafarers" ${state.catanConfig.seafarers ? "checked" : ""} /><span><strong>Navegantes</strong><small>Habilita puntos especiales del escenario y misiones.</small></span></label>
              <label class="module-option"><input type="checkbox" data-catan-module="citiesKnights" ${state.catanConfig.citiesKnights ? "checked" : ""} /><span><strong>Ciudades y Caballeros</strong><small>Metrópolis, Defensor de Catán, Mercader, caballeros y bárbaros.</small></span></label>
              <label class="module-option"><input type="checkbox" data-catan-module="other" ${state.catanConfig.other ? "checked" : ""} /><span><strong>Otros escenarios o expansiones</strong><small>Agrega misiones y un ajuste flexible para reglas especiales.</small></span></label>
            </div>
          </div>
        </div>`;
      }

      function setupTemplate() {
        const playersHtml = state.players.length
          ? state.players.map((player, index) => `
              <div class="player">
                ${avatar(player)}
                <span class="player-name">${escapeHtml(player.name)}</span>
                <span class="player-number">#${String(index + 1).padStart(2,"0")}</span>
                <button class="remove" type="button" data-remove="${player.id}" aria-label="Quitar a ${escapeHtml(player.name)}">✕</button>
              </div>`).join("")
          : `<div class="empty"><span aria-hidden="true">◎</span><strong>Aún no hay participantes.</strong><span>Agrega al menos 2 para comenzar.</span></div>`;

        return layout(`
          <main class="shell">
            <div class="heading">
              <p class="eyebrow">✦ Todo listo para jugar</p>
              <h1>Una ronda a la vez.</h1>
              <p>Agrega a quienes juegan y elige el tipo de partida.</p>
            </div>
            <div class="grid">
              <section class="panel" aria-labelledby="players-title">
                <div class="panel-head">
                  <div><p class="step">PASO 01</p><h2 id="players-title">Participantes</h2></div>
                  <span class="badge count">${state.players.length}/12</span>
                </div>
                <form id="add-player" class="add-form">
                  <label class="sr-only" for="player-name">Nombre del participante</label>
                  <input id="player-name" maxlength="28" autocomplete="off" placeholder="Escribe un nombre" />
                  <button class="btn" type="submit">＋ Agregar</button>
                </form>
                <div class="player-list" aria-live="polite">${playersHtml}</div>
              </section>
              <section class="panel limit-panel" aria-labelledby="limit-title">
                <div><p class="step">PASO 02</p><h2 id="limit-title">Tipo de juego</h2><p class="copy">Elige el juego o la forma de llevar el resultado.</p></div>
                <div class="mode-options" role="radiogroup" aria-label="Tipo de juego">
                  <label class="mode-option"><input type="radio" name="mode" value="limit" ${state.mode === "limit" ? "checked" : ""} /><span><strong>Puntos con tope</strong><small>Suma o descuenta por ronda. La partida se detiene al alcanzar el límite.</small></span></label>
                  <label class="mode-option"><input type="radio" name="mode" value="cumulative" ${state.mode === "cumulative" ? "checked" : ""} /><span><strong>Acumulativo / Carioca</strong><small>Se suman las rondas y el menor puntaje va ganando.</small></span></label>
                  <label class="mode-option catan-option"><input type="radio" name="mode" value="catan" ${state.mode === "catan" ? "checked" : ""} /><span><strong>Calculadora de Catán</strong><small>Calcula los puntos desde las piezas y activa solo las expansiones que usarás.</small></span></label>
                  <label class="mode-option seven-option"><input type="radio" name="mode" value="sevenWonders" ${state.mode === "sevenWonders" ? "checked" : ""} /><span><strong>7 Wonders</strong><small>Calcula la puntuación final por categorías, incluida la mejor combinación científica.</small></span></label>
                </div>
                ${setupModeDetails()}
                <button id="start" class="btn start" type="button">Comenzar partida →</button>
              </section>
            </div>
          </main>`, "Nueva partida");
      }

      function scoreGameTemplate() {
        const scoreTotals = totals();
        const ordered = ranking();
        const scoresOnly = ordered.map(player => player.total);
        const lowestScore = scoresOnly.length ? Math.min(...scoresOnly) : 0;
        const highestScore = scoresOnly.length ? Math.max(...scoresOnly) : 0;
        const reached = state.mode === "limit" ? ordered.filter(player => player.total >= state.limit) : [];
        const finished = state.mode === "limit" && reached.length > 0;
        const enteredCount = state.players.filter(player => (state.roundDraft[player.id]?.value ?? "") !== "").length;
        const summaryRows = ordered.map((player, index) => {
          const draft = state.roundDraft[player.id] || { value: "", operation: "add" };
          const pending = draft.value !== "";
          const delta = draftDelta(player.id);
          const percent = state.mode === "limit"
            ? Math.max(0, Math.min(100, player.total / state.limit * 100))
            : highestScore === lowestScore ? (highestScore === 0 ? 0 : 100) : Math.max(0, Math.min(100, (highestScore - player.total) / (highestScore - lowestScore) * 100));
          const detail = pending
            ? `Ronda ${state.rounds.length + 1}: ${delta > 0 ? "+" : ""}${format(delta)} puntos pendientes`
            : "Selecciona para ingresar los puntos de esta ronda";
          return `<button class="catan-summary-row ${pending ? "pending" : ""} ${state.mode === "limit" && player.total >= state.limit ? "winner" : ""}" type="button" data-open-score="${player.id}" aria-label="Ingresar puntuación de ${escapeHtml(player.name)}" ${finished ? "disabled" : ""}>
            <span class="catan-summary-rank">#${index + 1}</span>${avatar(player)}
            <span class="catan-summary-main"><strong>${escapeHtml(player.name)}</strong><small>${detail}</small><span class="track" aria-hidden="true"><span style="width:${percent}%;background:${player.color}"></span></span></span>
            <span class="catan-summary-total"><strong>${format(player.total)}</strong><small>total actual</small></span>
            <span class="catan-summary-open ${pending ? "pending" : ""}">${pending ? `${delta > 0 ? "+" : ""}${format(delta)} pts` : "Ingresar puntos →"}</span>
          </button>`;
        }).join("");

        const editorPlayer = state.scoreEditor ? state.players.find(player => player.id === state.scoreEditor) : null;
        let editor = "";
        if (editorPlayer && !finished) {
          const draft = state.roundDraft[editorPlayer.id] || { value: "", operation: "add" };
          const currentTotal = scoreTotals[editorPlayer.id] || 0;
          editor = `<div class="catan-modal" data-score-backdrop>
            <section class="catan-dialog" role="dialog" aria-modal="true" aria-labelledby="score-editor-title">
              <div class="catan-dialog-head">${avatar(editorPlayer)}<div><h2 id="score-editor-title">${escapeHtml(editorPlayer.name)}</h2><p>Ronda ${state.rounds.length + 1} · ingresa su puntuación</p></div><button id="close-score-editor" class="catan-dialog-close" type="button" aria-label="Cerrar puntuación del jugador">✕</button></div>
              <form id="score-player-form">
                <div class="catan-editor-body">
                  <div class="score-editor-current"><span>Puntaje acumulado</span><strong>${format(currentTotal)} pts</strong></div>
                  <div class="score-editor-form">
                    <div class="score-operation" role="group" aria-label="Operación para ${escapeHtml(editorPlayer.name)}">
                      <button class="operation-btn ${draft.operation === "add" ? "active" : ""}" type="button" data-operation="add" aria-pressed="${draft.operation === "add"}">＋ Sumar</button>
                      <button class="operation-btn ${draft.operation === "subtract" ? "active" : ""}" type="button" data-operation="subtract" aria-pressed="${draft.operation === "subtract"}">− Descontar</button>
                    </div>
                    <label class="sr-only" for="score-editor-value">Puntos de ${escapeHtml(editorPlayer.name)}</label>
                    <div class="score-editor-input"><input id="score-editor-value" type="number" inputmode="numeric" min="0" step="1" value="${escapeHtml(draft.value)}" placeholder="0" /><span>PTS</span></div>
                    <p class="score-editor-help">El valor quedará preparado en el resumen. Cuando termines con los jugadores, guarda la ronda completa.</p>
                  </div>
                </div>
                <div class="catan-dialog-foot"><span>Puedes volver a abrir esta ficha antes de guardar la ronda.</span><button class="btn" type="submit">Aplicar y volver al resumen</button></div>
              </form>
            </section>
          </div>`;
        }
        const history = state.rounds.length
          ? `<div class="table-wrap"><table><thead><tr><th>Ronda</th>${state.players.map(p => `<th>${escapeHtml(p.name)}</th>`).join("")}</tr></thead>
             <tbody>${state.rounds.map((round, index) => `<tr><td class="round-cell">#${String(index+1).padStart(2,"0")}</td>${state.players.map(p => `<td class="${(round.scores[p.id] || 0) < 0 ? "score-negative" : ""}">${format(round.scores[p.id] || 0)}</td>`).join("")}</tr>`).join("")}</tbody>
             <tfoot><tr><td>Total</td>${state.players.map(p => `<td class="${(scoreTotals[p.id] || 0) < 0 ? "score-negative" : ""}">${format(scoreTotals[p.id] || 0)}</td>`).join("")}</tr></tfoot></table></div>`
          : `<div class="empty empty-history"><span>⚑</span><strong>La primera ronda aparecerá aquí.</strong></div>`;

        return layout(`
          <main class="shell game-shell">
            <div class="game-head">
              <div><p class="eyebrow">♛ Partida en curso</p><h1>Puntaje de la partida</h1></div>
              <div class="game-actions"><div class="limit-badge ${state.mode === "cumulative" ? "cumulative" : ""}">${state.mode === "limit" ? `<span>TOPE</span>${format(state.limit)} pts` : `<span>MODO</span>Acumulativo · menor gana`}</div><button id="new-game" class="btn btn-secondary" type="button">↻ Nueva partida</button></div>
            </div>
            ${finished ? `<div class="finish" role="status"><div class="finish-icon">♛</div><div><p>¡Puntaje tope alcanzado!</p><h2>${reached.map(p => escapeHtml(p.name)).join(" y ")}</h2><span>La partida llegó a su límite. Puedes revisar o deshacer la última ronda.</span></div></div>` : ""}
            <section class="panel catan-summary" aria-labelledby="round-summary-title"><div class="panel-head"><div><p class="step">RONDA ${String(state.rounds.length+1).padStart(2,"0")} · CLASIFICACIÓN EN VIVO</p><h2 id="round-summary-title">Resumen de jugadores</h2><p class="catan-summary-copy">Selecciona un jugador para sumar o descontar su puntuación.</p></div><span class="badge">${enteredCount}/${state.players.length} ingresados</span></div><div class="catan-summary-list">${summaryRows}</div><div class="round-save-bar"><div><strong>${enteredCount ? (enteredCount === 1 ? "1 puntuación preparada" : `${enteredCount} puntuaciones preparadas`) : "Aún no ingresas puntuaciones"}</strong><small>Los jugadores sin puntuación se guardarán con 0 puntos.</small></div><button id="save-round" class="btn" type="button" ${finished ? "disabled" : ""}>＋ Guardar ronda ${state.rounds.length + 1}</button></div></section>
            <section class="panel history" aria-labelledby="history-title">
              <div class="history-head"><div><p class="step">REGISTRO</p><h2 id="history-title">Historial de rondas</h2></div>
                <div class="history-actions"><button id="undo" class="btn btn-ghost" type="button" ${state.rounds.length ? "" : "disabled"}>↶ Deshacer última</button><button id="setup" class="btn btn-ghost" type="button">◎ Cambiar participantes</button></div>
              </div>${history}
            </section>
            ${editor}
          </main>`, `Ronda ${state.rounds.length + 1}`);
      }

      function catanStepper(playerId, field, value, label, note = "") {
        return `<div class="catan-field"><span>${label}</span>${note ? `<small>${note}</small>` : ""}<div class="stepper"><button type="button" data-catan-player="${playerId}" data-catan-field="${field}" data-catan-delta="-1" aria-label="Restar uno a ${label}">−</button><output>${value}</output><button type="button" data-catan-player="${playerId}" data-catan-field="${field}" data-catan-delta="1" aria-label="Sumar uno a ${label}">+</button></div></div>`;
      }

      function catanToggle(playerId, field, checked, label, note) {
        return `<label class="catan-toggle"><input type="checkbox" data-catan-toggle="${field}" data-catan-player="${playerId}" ${checked ? "checked" : ""} /><span><strong>${label}</strong><small>${note}</small></span></label>`;
      }

      function catanTemplate() {
        const config = state.catanConfig;
        const target = config.target;
        const ordered = state.players.map((player, index) => {
          const stats = state.catan[player.id];
          return { ...player, originalIndex: index, stats, total: catanScore(stats) };
        }).sort((a, b) => b.total - a.total || a.originalIndex - b.originalIndex);
        const barbarianStrength = ordered.reduce((sum, player) => sum + player.stats.cities + player.stats.metropolises, 0);
        const islandDefense = ordered.reduce((sum, player) => sum + knightStrength(player.stats), 0);
        const islandSafe = islandDefense >= barbarianStrength;
        const winners = ordered.filter(player => player.total >= target);
        const activeModules = ["Base", config.seafarers ? "Navegantes" : "", config.citiesKnights ? "Ciudades y Caballeros" : "", config.other ? "Otros escenarios" : ""].filter(Boolean).join(" · ");
        const summaryRows = ordered.map((player, index) => {
          const progress = Math.max(0, Math.min(100, player.total / target * 100));
          const details = [
            `${player.stats.settlements} poblado${player.stats.settlements === 1 ? "" : "s"}`,
            `${player.stats.cities} ciudad${player.stats.cities === 1 ? "" : "es"}`,
            config.citiesKnights ? `${player.stats.metropolises} metrópolis` : "",
            `${player.stats.vpCards} PV extra`,
            config.citiesKnights ? `${knightStrength(player.stats)} de defensa` : ""
          ].filter(Boolean).join(" · ");
          return `<button class="catan-summary-row ${player.total >= target ? "winner" : ""}" type="button" data-open-catan="${player.id}" aria-label="Abrir y actualizar la situación de ${escapeHtml(player.name)}">
            <span class="catan-summary-rank">#${index + 1}</span>${avatar(player)}
            <span class="catan-summary-main"><strong>${escapeHtml(player.name)}</strong><small>${details}</small><span class="track" aria-hidden="true"><span style="width:${progress}%;background:${player.color}"></span></span></span>
            <span class="catan-summary-total"><strong>${player.total}</strong><small>de ${target} PV</small></span>
            <span class="catan-summary-open">Ver y editar →</span>
          </button>`;
        }).join("");

        const editorPlayer = state.catanEditor ? ordered.find(player => player.id === state.catanEditor) : null;
        let editor = "";
        if (editorPlayer) {
          const player = editorPlayer;
          const index = ordered.findIndex(item => item.id === player.id);
          const defense = knightStrength(player.stats);
          const progress = Math.max(0, Math.min(100, player.total / target * 100));
          const structures = [
            catanStepper(player.id,"settlements",player.stats.settlements,"Poblados","1 PV cada uno"),
            catanStepper(player.id,"cities",player.stats.cities,"Ciudades","2 PV; incluye las que tienen metrópolis"),
            config.citiesKnights ? catanStepper(player.id,"metropolises",player.stats.metropolises,"Metrópolis","+2 PV adicionales cada una") : ""
          ].join("");
          const scoreItems = [
            catanStepper(player.id,"vpCards",player.stats.vpCards,"Cartas o fichas de PV","1 PV cada una"),
            (config.seafarers || config.other) ? catanStepper(player.id,"scenario",player.stats.scenario,"Escenario / misiones","Puntos especiales obtenidos") : "",
            config.citiesKnights ? catanStepper(player.id,"defender",player.stats.defender,"Defensor de Catán","1 PV por ficha") : "",
            catanStepper(player.id,"custom",player.stats.custom,"Ajuste manual","Para otras reglas; admite negativos")
          ].join("");
          const awardItems = [
            catanToggle(player.id,"longestRoad",player.stats.longestRoad,config.seafarers ? "Gran ruta comercial" : "Gran carretera","+2 PV · solo un jugador"),
            !config.citiesKnights ? catanToggle(player.id,"largestArmy",player.stats.largestArmy,"Mayor ejército","+2 PV · solo un jugador") : "",
            catanToggle(player.id,"harborCaptain",player.stats.harborCaptain,"Capitán del puerto","+2 PV · solo un jugador"),
            config.citiesKnights ? catanToggle(player.id,"merchant",player.stats.merchant,"Mercader","+1 PV mientras lo conserve") : ""
          ].join("");
          editor = `<div class="catan-modal" data-catan-backdrop>
            <section class="catan-dialog" role="dialog" aria-modal="true" aria-labelledby="catan-editor-title">
              <div class="catan-dialog-head">${avatar(player)}<div><h2 id="catan-editor-title">${escapeHtml(player.name)}</h2><p>Posición #${index + 1} · los cambios se guardan al instante</p></div><button id="close-catan-editor" class="catan-dialog-close" type="button" aria-label="Cerrar ficha del jugador">✕</button></div>
              <div class="catan-editor-body">
                <div class="catan-score"><span>Total automático<strong>${player.total}</strong></span><div class="catan-score-result"><span>Meta: ${target} PV</span></div></div>
                <div class="catan-breakdown">${catanBreakdown(player.stats).map(part => `<span>${part}</span>`).join("")}</div>
                <div class="track" role="progressbar" aria-label="${escapeHtml(player.name)}: ${Math.round(progress)}% de la meta" aria-valuenow="${Math.round(progress)}" aria-valuemin="0" aria-valuemax="100" style="margin-top:.65rem"><span style="width:${progress}%;background:${player.color}"></span></div>
                <div class="mini-section"><div class="mini-section-title"><strong>Construcciones</strong><span>El total cambia al instante</span></div><div class="catan-fields">${structures}</div></div>
                <div class="mini-section"><div class="mini-section-title"><strong>Puntos adicionales</strong><span>Cartas, fichas y escenarios</span></div><div class="catan-fields">${scoreItems}</div></div>
                <div class="mini-section"><div class="mini-section-title"><strong>Bonificaciones en posesión</strong><span>Marca quién la tiene</span></div><div class="catan-toggles">${awardItems}</div></div>
                ${config.citiesKnights ? `<div class="mini-section"><div class="mini-section-title"><strong>Caballeros activos</strong><span>${defense} de defensa</span></div><div class="catan-fields knights">${catanStepper(player.id,"basic",player.stats.basic,"Básico","Fuerza 1")}${catanStepper(player.id,"strong",player.stats.strong,"Fuerte","Fuerza 2")}${catanStepper(player.id,"mighty",player.stats.mighty,"Poderoso","Fuerza 3")}</div></div>` : ""}
              </div>
              <div class="catan-dialog-foot"><span>Todos los cambios ya están reflejados en el resumen.</span><button class="btn" type="button" data-close-catan-editor>Listo · volver al resumen</button></div>
            </section>
          </div>`;
        }

        return layout(`<main class="shell game-shell">
          <div class="game-head"><div><p class="eyebrow">♜ ${activeModules}</p><h1>Calculadora de Catán</h1></div><div class="game-actions"><div class="limit-badge"><span>META</span>${target} PV</div><button id="new-catan" class="btn btn-secondary" type="button">↻ Nueva partida</button></div></div>
          ${winners.length ? `<div class="finish" role="status"><div class="finish-icon">♛</div><div><p>¡Meta de victoria alcanzada!</p><h2>${winners.map(player => escapeHtml(player.name)).join(" y ")}</h2><span>Revisa el tablero y confirma el cierre de la partida.</span></div></div>` : ""}
          ${config.citiesKnights ? `<section class="panel catan-threat" aria-labelledby="defense-title"><div class="panel-head panel-head-space"><div><p class="step">ATAQUE BÁRBARO</p><h2 id="defense-title">Defensa de la isla</h2></div><span class="badge">En vivo</span></div><div class="threat-grid"><div class="threat-metric"><span>Fuerza bárbara</span><strong>${barbarianStrength}</strong><small>Ciudades + metrópolis</small></div><div class="threat-metric"><span>Defensa de Catán</span><strong>${islandDefense}</strong><small>Caballeros activos</small></div><div class="threat-metric threat-status ${islandSafe ? "safe" : "danger"}"><span>Resultado actual</span><strong>${barbarianStrength === 0 ? "Sin amenaza" : islandSafe ? "La isla resiste" : "Defensa insuficiente"}</strong><small>${barbarianStrength === 0 ? "Agrega las ciudades del tablero" : islandSafe ? `Ventaja de ${islandDefense - barbarianStrength}` : `Faltan ${barbarianStrength - islandDefense} de fuerza`}</small></div></div><div class="threat-actions"><span>Los caballeros básicos, fuertes y poderosos aportan 1, 2 y 3 de fuerza. Solo cuentan los activos.</span><button id="deactivate-knights" class="btn btn-secondary" type="button">Ataque resuelto · desactivar caballeros</button></div></section>` : ""}
          <section class="panel catan-summary" aria-labelledby="catan-summary-title"><div class="panel-head"><div><p class="step">CLASIFICACIÓN EN VIVO</p><h2 id="catan-summary-title">Resumen de jugadores</h2><p class="catan-summary-copy">Selecciona un jugador para abrir su ficha y actualizar su situación.</p></div><span class="badge">${ordered.length} jugadores</span></div><div class="catan-summary-list">${summaryRows}</div></section>
          <div class="history-actions" style="margin-top:1rem"><button id="setup-catan" class="btn btn-ghost" type="button">◎ Cambiar participantes o modo</button></div>
          ${editor}
        </main>`, `Catán · ${target} PV`);
      }

      function sevenStepper(playerId, field, value, label, note = "", quick = false) {
        const controls = quick
          ? `<button type="button" data-seven-player="${playerId}" data-seven-field="${field}" data-seven-delta="-5" aria-label="Restar cinco a ${label}">−5</button><button type="button" data-seven-player="${playerId}" data-seven-field="${field}" data-seven-delta="-1" aria-label="Restar uno a ${label}">−</button><output>${value}</output><button type="button" data-seven-player="${playerId}" data-seven-field="${field}" data-seven-delta="1" aria-label="Sumar uno a ${label}">+</button><button type="button" data-seven-player="${playerId}" data-seven-field="${field}" data-seven-delta="5" aria-label="Sumar cinco a ${label}">+5</button>`
          : `<button type="button" data-seven-player="${playerId}" data-seven-field="${field}" data-seven-delta="-1" aria-label="Restar uno a ${label}">−</button><output>${value}</output><button type="button" data-seven-player="${playerId}" data-seven-field="${field}" data-seven-delta="1" aria-label="Sumar uno a ${label}">+</button>`;
        return `<div class="catan-field"><span>${label}</span>${note ? `<small>${note}</small>` : ""}<div class="stepper ${quick ? "seven-stepper" : ""}">${controls}</div></div>`;
      }

      function sevenWondersTemplate() {
        const ordered = state.players.map((player, index) => {
          const stats = state.sevenWonders[player.id];
          return { ...player, originalIndex: index, stats, total: sevenWondersScore(stats) };
        }).sort((a, b) => b.total - a.total || b.stats.coins - a.stats.coins || a.originalIndex - b.originalIndex);
        const highest = Math.max(0, ...ordered.map(player => player.total));
        const summaryRows = ordered.map((player, index) => {
          const points = sevenWondersBreakdown(player.stats);
          const progress = highest > 0 ? Math.max(0, Math.min(100, player.total / highest * 100)) : 0;
          const details = `Maravilla ${points.wonder} · Tesorería ${points.treasury} · Militar ${points.military} · Ciencia ${points.science}`;
          return `<button class="catan-summary-row" type="button" data-open-seven="${player.id}" aria-label="Abrir y actualizar la puntuación de ${escapeHtml(player.name)}">
            <span class="catan-summary-rank">#${index + 1}</span>${avatar(player)}
            <span class="catan-summary-main"><strong>${escapeHtml(player.name)}</strong><small>${details}</small><span class="track" aria-hidden="true"><span style="width:${progress}%;background:${player.color}"></span></span></span>
            <span class="catan-summary-total"><strong>${format(player.total)}</strong><small>${player.stats.coins} monedas</small></span>
            <span class="catan-summary-open">Ver y editar →</span>
          </button>`;
        }).join("");

        const editorPlayer = state.sevenWondersEditor ? ordered.find(player => player.id === state.sevenWondersEditor) : null;
        let editor = "";
        if (editorPlayer) {
          const player = editorPlayer;
          const position = ordered.findIndex(item => item.id === player.id) + 1;
          const points = sevenWondersBreakdown(player.stats);
          const science = sevenScienceResult(player.stats);
          const breakdown = [
            `Maravilla: ${points.wonder}`,
            `Tesorería: ${points.treasury}`,
            `Conflictos: ${points.military}`,
            `Civiles: ${points.civil}`,
            `Comerciales: ${points.commercial}`,
            `Ciencia: ${points.science}`,
            `Gremios: ${points.guilds}`
          ];
          const directPoints = [
            sevenStepper(player.id,"wonder",player.stats.wonder,"Tablero de Maravilla","Suma los PV de las etapas construidas",true),
            sevenStepper(player.id,"civil",player.stats.civil,"Cartas civiles azules","Suma los PV impresos",true),
            sevenStepper(player.id,"commercial",player.stats.commercial,"Cartas comerciales amarillas","Calcula y suma sus PV finales",true),
            sevenStepper(player.id,"guilds",player.stats.guilds,"Gremios morados","Calcula y suma sus PV finales",true)
          ].join("");
          const military = [
            sevenStepper(player.id,"defeat",player.stats.defeat,"Fichas de derrota","−1 PV cada una"),
            sevenStepper(player.id,"victory1",player.stats.victory1,"Victorias de Era I","+1 PV cada una"),
            sevenStepper(player.id,"victory3",player.stats.victory3,"Victorias de Era II","+3 PV cada una"),
            sevenStepper(player.id,"victory5",player.stats.victory5,"Victorias de Era III","+5 PV cada una")
          ].join("");
          const scienceFields = [
            sevenStepper(player.id,"scienceTablet",player.stats.scienceTablet,"Tablillas","Símbolos científicos"),
            sevenStepper(player.id,"scienceGear",player.stats.scienceGear,"Engranajes","Símbolos científicos"),
            sevenStepper(player.id,"scienceCompass",player.stats.scienceCompass,"Compases","Símbolos científicos"),
            sevenStepper(player.id,"scienceWild",player.stats.scienceWild,"Símbolos a elección","La calculadora busca la mejor combinación")
          ].join("");
          editor = `<div class="catan-modal" data-seven-backdrop>
            <section class="catan-dialog" role="dialog" aria-modal="true" aria-labelledby="seven-editor-title">
              <div class="catan-dialog-head">${avatar(player)}<div><h2 id="seven-editor-title">${escapeHtml(player.name)}</h2><p>Posición #${position} · los cambios se guardan al instante</p></div><button id="close-seven-editor" class="catan-dialog-close" type="button" aria-label="Cerrar ficha del jugador">✕</button></div>
              <div class="catan-editor-body">
                <div class="catan-score"><span>Total automático<strong>${format(player.total)}</strong></span><div class="catan-score-result"><span>Mayor puntaje gana</span></div></div>
                <div class="catan-breakdown">${breakdown.map(part => `<span>${part}</span>`).join("")}</div>
                <div class="mini-section"><div class="mini-section-title"><strong>Puntos directos</strong><span>Maravilla y cartas</span></div><div class="catan-fields">${directPoints}</div></div>
                <div class="mini-section"><div class="mini-section-title"><strong>Tesorería</strong><span>1 PV por cada 3 monedas</span></div><div class="catan-fields">${sevenStepper(player.id,"coins",player.stats.coins,"Monedas restantes",`${player.stats.coins} monedas = ${points.treasury} PV`,true)}</div></div>
                <div class="mini-section"><div class="mini-section-title"><strong>Conflictos militares</strong><span>Total automático: ${points.military} PV</span></div><div class="catan-fields">${military}</div></div>
                <div class="mini-section"><div class="mini-section-title"><strong>Estructuras científicas verdes</strong><span>Cuadrados + conjuntos de 3</span></div><div class="catan-fields">${scienceFields}</div><div class="seven-science-result" style="margin-top:.55rem"><span>Mejor combinación: ${science.counts[0]} tablilla${science.counts[0] === 1 ? "" : "s"}, ${science.counts[1]} engranaje${science.counts[1] === 1 ? "" : "s"} y ${science.counts[2]} compás${science.counts[2] === 1 ? "" : "es"}. Cada tipo puntúa al cuadrado y cada conjunto completo agrega 7 PV.</span><strong>${science.score} PV</strong></div></div>
              </div>
              <div class="catan-dialog-foot"><span>La clasificación y el desempate por monedas ya están actualizados.</span><button class="btn" type="button" data-close-seven-editor>Listo · volver al resumen</button></div>
            </section>
          </div>`;
        }

        return layout(`<main class="shell game-shell">
          <div class="game-head"><div><p class="eyebrow">◈ Puntuación final por categorías</p><h1>Calculadora de 7 Wonders</h1></div><div class="game-actions"><div class="limit-badge cumulative"><span>VICTORIA</span>Mayor puntaje</div><button id="new-seven" class="btn btn-secondary" type="button">↻ Nueva partida</button></div></div>
          <section class="panel catan-summary" aria-labelledby="seven-summary-title"><div class="panel-head"><div><p class="step">CLASIFICACIÓN FINAL</p><h2 id="seven-summary-title">Resumen de jugadores</h2><p class="catan-summary-copy">Selecciona un jugador para desplegar sus categorías y actualizar su puntuación.</p></div><span class="badge">${ordered.length} jugadores</span></div><div class="catan-summary-list">${summaryRows}</div></section>
          <div class="history-actions" style="margin-top:1rem"><button id="setup-seven" class="btn btn-ghost" type="button">◎ Cambiar participantes o tipo de juego</button></div>
          ${editor}
        </main>`, "7 Wonders · puntuación final");
      }

      function gameTemplate() {
        if (state.mode === "catan") return catanTemplate();
        if (state.mode === "sevenWonders") return sevenWondersTemplate();
        return scoreGameTemplate();
      }

      function render() {
        app.innerHTML = state.phase === "setup" ? setupTemplate() : gameTemplate();
        document.body.classList.toggle("modal-open", Boolean(state.phase === "game" && (state.catanEditor || state.scoreEditor || state.sevenWondersEditor)));
        if (state.phase === "setup") bindSetup();
        else if (state.mode === "catan") bindCatan();
        else if (state.mode === "sevenWonders") bindSevenWonders();
        else bindGame();
      }

      function bindSetup() {
        document.querySelector("#add-player").addEventListener("submit", event => {
          event.preventDefault();
          const input = document.querySelector("#player-name");
          const name = input.value.trim();
          if (!name) return showToast("Escribe un nombre para agregar a la persona.");
          if (state.players.some(player => player.name.toLowerCase() === name.toLowerCase())) return showToast("Ese nombre ya está en la lista.");
          if (state.players.length >= 12) return showToast("Puedes agregar hasta 12 participantes.");
          state.players.push({ id: uid(), name, color: COLORS[state.players.length % COLORS.length] });
          render();
          document.querySelector("#player-name").focus();
        });
        document.querySelectorAll("[data-remove]").forEach(button => button.addEventListener("click", () => {
          state.players = state.players.filter(player => player.id !== button.dataset.remove);
          render();
        }));
        document.querySelectorAll('[name="mode"]').forEach(input => input.addEventListener("change", event => {
          state.mode = event.target.value;
          render();
        }));
        document.querySelector("#limit")?.addEventListener("input", event => state.limit = Number(event.target.value));
        document.querySelector("#catan-target")?.addEventListener("input", event => state.catanConfig.target = Number(event.target.value));
        document.querySelectorAll("[data-catan-module]").forEach(input => input.addEventListener("change", () => {
          const module = input.dataset.catanModule;
          state.catanConfig[module] = input.checked;
          if (module === "citiesKnights" && input.checked && state.catanConfig.target === 10) state.catanConfig.target = 13;
          render();
        }));
        document.querySelector("#start").addEventListener("click", () => {
          const limit = state.mode === "limit" ? Number(document.querySelector("#limit").value) : state.limit;
          const catanTarget = state.mode === "catan" ? Number(document.querySelector("#catan-target").value) : state.catanConfig.target;
          if (state.players.length < 2) return showToast("Agrega al menos 2 participantes.");
          if (state.mode === "sevenWonders" && (state.players.length < 3 || state.players.length > 7)) return showToast("7 Wonders se juega con 3 a 7 participantes.");
          if (state.mode === "limit" && (!Number.isFinite(limit) || limit <= 0)) return showToast("Ingresa un puntaje tope mayor que 0.");
          if (state.mode === "catan" && (!Number.isFinite(catanTarget) || catanTarget <= 0)) return showToast("Ingresa una meta de victoria mayor que 0.");
          state.limit = limit;
          state.catanConfig.target = catanTarget;
          state.rounds = [];
          if (state.mode === "catan") {
            state.catan = freshCatanStats();
            state.catanEditor = null;
          } else if (state.mode === "sevenWonders") {
            state.sevenWonders = freshSevenWondersStats();
            state.sevenWondersEditor = null;
          } else {
            state.roundDraft = freshRoundDraft();
            state.scoreEditor = null;
          }
          state.phase = "game";
          render();
        });
      }

      function bindGame() {
        const closeEditor = () => {
          state.scoreEditor = null;
          render();
        };
        document.querySelectorAll("[data-open-score]").forEach(button => button.addEventListener("click", () => {
          state.scoreEditor = button.dataset.openScore;
          render();
          document.querySelector("#score-editor-value")?.focus();
        }));
        document.querySelector("#close-score-editor")?.addEventListener("click", closeEditor);
        document.querySelector("[data-score-backdrop]")?.addEventListener("click", event => {
          if (event.target === event.currentTarget) closeEditor();
        });
        document.querySelectorAll("[data-operation]").forEach(button => button.addEventListener("click", () => {
          document.querySelectorAll("[data-operation]").forEach(option => {
            const active = option === button;
            option.classList.toggle("active", active);
            option.setAttribute("aria-pressed", String(active));
          });
        }));
        document.querySelector("#score-player-form")?.addEventListener("submit", event => {
          event.preventDefault();
          const input = document.querySelector("#score-editor-value");
          const rawValue = input.value.trim();
          const parsed = rawValue === "" ? 0 : Math.abs(Number(rawValue));
          if (!Number.isFinite(parsed)) return showToast("Ingresa una puntuación válida.");
          const operation = document.querySelector('[data-operation="subtract"]')?.classList.contains("active") ? "subtract" : "add";
          state.roundDraft[state.scoreEditor] = { value: rawValue === "" ? "" : String(parsed), operation };
          const player = state.players.find(item => item.id === state.scoreEditor);
          state.scoreEditor = null;
          render();
          showToast(`Puntuación de ${player.name} preparada para esta ronda.`);
        });
        document.querySelector("#save-round").addEventListener("click", () => {
          const before = totals();
          const scores = {};
          state.players.forEach(player => { scores[player.id] = draftDelta(player.id); });
          const reached = state.mode === "limit" ? state.players.filter(player => (before[player.id] || 0) < state.limit && (before[player.id] || 0) + scores[player.id] >= state.limit) : [];
          state.rounds.push({ id: uid(), scores });
          state.roundDraft = freshRoundDraft();
          state.scoreEditor = null;
          render();
          showToast(reached.length ? `${reached.map(p => p.name).join(" y ")} alcanzó el tope.` : `Ronda ${state.rounds.length} guardada.`);
        });
        document.querySelector("#undo").addEventListener("click", () => {
          if (!state.rounds.length) return;
          state.rounds.pop();
          render();
          showToast("Se eliminó la última ronda.");
        });
        document.querySelector("#new-game").addEventListener("click", () => {
          const hasPending = Object.values(state.roundDraft).some(draft => draft.value !== "");
          if ((!state.rounds.length && !hasPending) || confirm("¿Iniciar una nueva partida? Se eliminarán las rondas y puntuaciones pendientes.")) {
            state.rounds = [];
            state.roundDraft = freshRoundDraft();
            state.scoreEditor = null;
            render();
            showToast("Nueva partida lista.");
          }
        });
        document.querySelector("#setup").addEventListener("click", () => {
          const hasPending = Object.values(state.roundDraft).some(draft => draft.value !== "");
          if ((!state.rounds.length && !hasPending) || confirm("¿Cambiar participantes? Se eliminarán las rondas y puntuaciones pendientes.")) {
            state.rounds = [];
            state.roundDraft = {};
            state.scoreEditor = null;
            state.phase = "setup";
            render();
          }
        });
      }

      function bindCatan() {
        const closeEditor = () => {
          state.catanEditor = null;
          render();
        };
        document.querySelectorAll("[data-open-catan]").forEach(button => button.addEventListener("click", () => {
          state.catanEditor = button.dataset.openCatan;
          render();
          document.querySelector("#close-catan-editor")?.focus();
        }));
        document.querySelector("#close-catan-editor")?.addEventListener("click", closeEditor);
        document.querySelector("[data-close-catan-editor]")?.addEventListener("click", closeEditor);
        document.querySelector("[data-catan-backdrop]")?.addEventListener("click", event => {
          if (event.target === event.currentTarget) closeEditor();
        });
        document.querySelectorAll("[data-catan-field]").forEach(button => button.addEventListener("click", () => {
          const scrollTop = document.querySelector(".catan-dialog")?.scrollTop || 0;
          const stats = state.catan[button.dataset.catanPlayer];
          const field = button.dataset.catanField;
          const delta = Number(button.dataset.catanDelta);
          if (field === "metropolises" && delta > 0 && stats.metropolises >= stats.cities) return showToast("Primero agrega la ciudad que tiene esa metrópolis.");
          if (field === "cities" && delta < 0 && stats.cities <= stats.metropolises) return showToast("No puedes tener más metrópolis que ciudades.");
          stats[field] = field === "custom" ? stats[field] + delta : Math.max(0, stats[field] + delta);
          render();
          const updatedButton = document.querySelector(`[data-catan-player="${button.dataset.catanPlayer}"][data-catan-field="${field}"][data-catan-delta="${delta}"]`);
          const dialog = document.querySelector(".catan-dialog");
          if (dialog) dialog.scrollTop = scrollTop;
          updatedButton?.focus();
        }));
        document.querySelectorAll("[data-catan-toggle]").forEach(input => input.addEventListener("change", () => {
          const scrollTop = document.querySelector(".catan-dialog")?.scrollTop || 0;
          const field = input.dataset.catanToggle;
          if (input.checked && ["longestRoad", "largestArmy", "harborCaptain", "merchant"].includes(field)) {
            Object.values(state.catan).forEach(stats => { stats[field] = false; });
          }
          state.catan[input.dataset.catanPlayer][field] = input.checked;
          render();
          const updatedInput = document.querySelector(`[data-catan-player="${input.dataset.catanPlayer}"][data-catan-toggle="${field}"]`);
          const dialog = document.querySelector(".catan-dialog");
          if (dialog) dialog.scrollTop = scrollTop;
          updatedInput?.focus();
          if (input.checked) showToast("Bonificación asignada; se quitó de cualquier otro jugador.");
        }));
        document.querySelector("#deactivate-knights")?.addEventListener("click", () => {
          if (!confirm("¿El ataque bárbaro ya se resolvió? Se pondrán en cero todos los caballeros activos.")) return;
          Object.values(state.catan).forEach(stats => { stats.basic = 0; stats.strong = 0; stats.mighty = 0; });
          render();
          showToast("Todos los caballeros quedaron desactivados.");
        });
        document.querySelector("#new-catan").addEventListener("click", () => {
          if (!confirm("¿Iniciar una nueva partida de Catán? Se reiniciarán todos los datos.")) return;
          state.catan = freshCatanStats();
          state.catanEditor = null;
          render();
          showToast("Nueva partida de Catán lista.");
        });
        document.querySelector("#setup-catan").addEventListener("click", () => {
          if (!confirm("¿Cambiar participantes o modo? Se perderá el seguimiento actual de Catán.")) return;
          state.catan = {};
          state.catanEditor = null;
          state.phase = "setup";
          render();
        });
      }

      function bindSevenWonders() {
        const closeEditor = () => {
          state.sevenWondersEditor = null;
          render();
        };
        document.querySelectorAll("[data-open-seven]").forEach(button => button.addEventListener("click", () => {
          state.sevenWondersEditor = button.dataset.openSeven;
          render();
          document.querySelector("#close-seven-editor")?.focus();
        }));
        document.querySelector("#close-seven-editor")?.addEventListener("click", closeEditor);
        document.querySelector("[data-close-seven-editor]")?.addEventListener("click", closeEditor);
        document.querySelector("[data-seven-backdrop]")?.addEventListener("click", event => {
          if (event.target === event.currentTarget) closeEditor();
        });
        document.querySelectorAll("[data-seven-field]").forEach(button => button.addEventListener("click", () => {
          const scrollTop = document.querySelector(".catan-dialog")?.scrollTop || 0;
          const playerId = button.dataset.sevenPlayer;
          const field = button.dataset.sevenField;
          const delta = Number(button.dataset.sevenDelta);
          const stats = state.sevenWonders[playerId];
          stats[field] = Math.max(0, stats[field] + delta);
          render();
          const updatedButton = document.querySelector(`[data-seven-player="${playerId}"][data-seven-field="${field}"][data-seven-delta="${delta}"]`);
          const dialog = document.querySelector(".catan-dialog");
          if (dialog) dialog.scrollTop = scrollTop;
          updatedButton?.focus();
        }));
        document.querySelector("#new-seven").addEventListener("click", () => {
          if (!confirm("¿Iniciar una nueva partida de 7 Wonders? Se reiniciarán todos los puntajes.")) return;
          state.sevenWonders = freshSevenWondersStats();
          state.sevenWondersEditor = null;
          render();
          showToast("Nueva partida de 7 Wonders lista.");
        });
        document.querySelector("#setup-seven").addEventListener("click", () => {
          if (!confirm("¿Cambiar participantes o tipo de juego? Se perderá la puntuación actual de 7 Wonders.")) return;
          state.sevenWonders = {};
          state.sevenWondersEditor = null;
          state.phase = "setup";
          render();
        });
      }

      document.addEventListener("keydown", event => {
        if (event.key === "Escape" && (state.catanEditor || state.scoreEditor || state.sevenWondersEditor)) {
          state.catanEditor = null;
          state.scoreEditor = null;
          state.sevenWondersEditor = null;
          render();
        }
      });

      render();
    </script>
  </body>
</html>
