<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#122033" />
    <meta
      name="description"
      content="Contador de puntos por rondas con participantes y puntaje tope configurable."
    />
    <title>Contador de Puntos por Rondas</title>
    <style>
      :root {
        --ink: #122033;
        --muted: #637286;
        --paper: #f7f5ee;
        --panel: #fff;
        --line: #dfe4e8;
        --lime: #c9ff62;
        --shadow: 0 18px 55px rgba(37, 49, 65, 0.08);
      }

      * { box-sizing: border-box; }
      html { background: var(--paper); }
      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 8% 8%, rgba(117, 231, 255, 0.19), transparent 27rem),
          radial-gradient(circle at 93% 30%, rgba(201, 255, 98, 0.18), transparent 25rem),
          var(--paper);
        color: var(--ink);
        font-family: "Avenir Next", Avenir, Montserrat, Inter, system-ui, sans-serif;
      }
      button, input { font: inherit; }
      button { cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: 0.5; }
      .sr-only {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
      }
      .header {
        border-bottom: 1px solid rgba(18,32,51,.1);
        background: rgba(247,245,238,.82);
        backdrop-filter: blur(14px);
      }
      .header-inner {
        width: min(1180px, calc(100% - 2rem)); min-height: 72px; margin: 0 auto;
        display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      }
      .brand { display: flex; align-items: center; gap: .65rem; font-size: .82rem; font-weight: 950; letter-spacing: .16em; }
      .brand-dot { width: 16px; height: 16px; border: 4px solid var(--ink); border-radius: 50%; box-shadow: 6px 0 0 -2px var(--lime); }
      .round-pill, .badge {
        display: inline-flex; align-items: center; gap: .45rem; border: 1px solid var(--line);
        border-radius: 999px; background: rgba(255,255,255,.83); color: var(--muted);
        font-size: .75rem; font-weight: 850; padding: .5rem .8rem;
      }
      .shell { width: min(1180px, calc(100% - 2rem)); margin: 0 auto; padding: clamp(2.5rem, 7vw, 5.5rem) 0 4rem; }
      .heading { max-width: 760px; margin-bottom: clamp(2rem, 5vw, 3.5rem); }
      .eyebrow { margin: 0 0 .8rem; color: #496075; font-size: .75rem; font-weight: 950; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(2.7rem, 7vw, 5.9rem); font-weight: 950; letter-spacing: -.07em; line-height: .96; }
      .heading > p:last-child { margin: 1.25rem 0 0; color: var(--muted); font-size: clamp(1rem, 2vw, 1.18rem); }
      .grid { display: grid; grid-template-columns: minmax(0,1.45fr) minmax(300px,.75fr); gap: 1.25rem; align-items: stretch; }
      .panel { border: 1px solid rgba(18,32,51,.11); border-radius: 24px; background: rgba(255,255,255,.93); box-shadow: var(--shadow); padding: clamp(1.2rem,3vw,2rem); }
      .panel-head, .history-head, .game-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
      .step { margin: 0 0 .4rem; color: #708095; font-size: .68rem; font-weight: 950; letter-spacing: .14em; }
      h2 { margin: 0; font-size: clamp(1.35rem,2.3vw,1.8rem); font-weight: 900; letter-spacing: -.035em; }
      .count { background: var(--ink); color: #fff; border-color: var(--ink); }
      .add-form { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: .75rem; margin: 1.5rem 0; }
      input {
        width: 100%; height: 48px; border: 1px solid #d9dfe4; border-radius: 12px;
        background: #fff; color: var(--ink); padding: 0 1rem; outline: none;
      }
      input:focus { border-color: #637286; box-shadow: 0 0 0 3px rgba(99,114,134,.18); }
      .btn {
        min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
        border: 1px solid var(--ink); border-radius: 12px; background: var(--ink); color: #fff;
        padding: .7rem 1rem; font-weight: 850; transition: transform .14s ease, background .14s ease;
      }
      .btn:hover:not(:disabled) { background: #263a52; }
      .btn:active:not(:disabled) { transform: translateY(1px); }
      .btn-secondary { border-color: var(--line); background: #fff; color: var(--ink); }
      .btn-secondary:hover:not(:disabled) { background: #f0f3f5; }
      .btn-ghost { border-color: transparent; background: transparent; color: var(--ink); }
      .btn-ghost:hover:not(:disabled) { background: #eef1f3; }
      .player-list { display: grid; gap: .65rem; }
      .empty { min-height: 160px; display: grid; place-items: center; align-content: center; gap: .35rem; border: 1px dashed #c8d0d8; border-radius: 17px; background: #fafbfb; color: var(--muted); text-align: center; }
      .empty strong { color: var(--ink); }
      .player { min-width: 0; display: grid; grid-template-columns: auto minmax(0,1fr) auto auto; align-items: center; gap: .8rem; border: 1px solid #e5e8eb; border-radius: 15px; padding: .65rem .75rem; }
      .avatar { width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; border: 2px solid rgba(18,32,51,.78); border-radius: 12px; color: var(--ink); font-size: .7rem; font-weight: 950; box-shadow: 2px 2px 0 rgba(18,32,51,.82); }
      .player-name { overflow: hidden; font-weight: 850; text-overflow: ellipsis; white-space: nowrap; }
      .player-number { color: #9aa5b0; font-size: .74rem; font-weight: 850; }
      .remove { width: 34px; min-height: 34px; padding: 0; border: 0; border-radius: 9px; background: transparent; color: #7b8998; font-size: 1rem; }
      .remove:hover { background: #f1f3f4; color: #c83232; }
      .limit-panel { min-height: 100%; display: flex; flex-direction: column; justify-content: space-between; gap: 2rem; background: linear-gradient(145deg,rgba(201,255,98,.25),transparent 46%),rgba(255,255,255,.94); }
      .copy { margin: .8rem 0 0; color: var(--muted); font-size: .9rem; line-height: 1.55; }
      .mode-options { display: grid; gap: .65rem; }
      .mode-option { display: grid; grid-template-columns: auto minmax(0,1fr); align-items: start; gap: .75rem; border: 1px solid #dfe4e8; border-radius: 15px; background: rgba(255,255,255,.78); padding: .85rem; cursor: pointer; transition: border-color .16s ease, background .16s ease; }
      .mode-option:has(input:checked) { border: 2px solid var(--ink); background: #fff; padding: calc(.85rem - 1px); }
      .mode-option input { width: 18px; height: 18px; margin: .15rem 0 0; padding: 0; accent-color: var(--ink); box-shadow: none; }
      .mode-option span { display: grid; gap: .18rem; }
      .mode-option strong { font-size: .87rem; }
      .mode-option small { color: var(--muted); font-size: .75rem; line-height: 1.4; }
      .limit-label { display: block; margin-bottom: .55rem; color: #607186; font-size: .72rem; font-weight: 950; letter-spacing: .07em; text-transform: uppercase; }
      .limit-wrap { position: relative; }
      .limit-wrap input { height: 84px; border: 2px solid var(--ink); border-radius: 17px; padding: 0 5rem 0 1.2rem; font-size: 2.2rem; font-weight: 950; letter-spacing: -.04em; }
      .limit-wrap span { position: absolute; top: 50%; right: 1.2rem; transform: translateY(-50%); color: #7b8895; font-size: .73rem; font-weight: 950; }
      .help { margin: .5rem 0 0; color: #8995a1; font-size: .77rem; }
      .cumulative-note { display: flex; align-items: flex-start; gap: .8rem; border: 1px solid rgba(18,32,51,.18); border-radius: 16px; background: rgba(201,255,98,.22); padding: 1rem; }
      .cumulative-note > span { font-size: 1.15rem; }
      .cumulative-note div { display: grid; gap: .2rem; }
      .cumulative-note strong { font-size: .85rem; }
      .cumulative-note small { color: var(--muted); font-size: .75rem; line-height: 1.45; }
      .start { min-height: 56px; border-radius: 16px; font-size: 1rem; }

      .game-shell { padding-top: clamp(2rem,5vw,4rem); }
      .game-head { align-items: flex-end; margin-bottom: 1.75rem; }
      .game-head h1 { font-size: clamp(2.3rem,6vw,4.7rem); }
      .game-actions, .history-actions { display: flex; align-items: center; justify-content: flex-end; gap: .7rem; flex-wrap: wrap; }
      .limit-badge { display: flex; align-items: baseline; gap: .45rem; border: 1px solid var(--line); border-radius: 13px; background: #fff; padding: .65rem .9rem; font-size: 1rem; font-weight: 950; }
      .limit-badge span { color: #7e8a96; font-size: .61rem; letter-spacing: .12em; }
      .limit-badge.cumulative { background: var(--lime); border-color: rgba(18,32,51,.35); }
      .finish { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.25rem; border: 2px solid var(--ink); border-radius: 20px; background: var(--lime); padding: 1.1rem 1.25rem; box-shadow: 5px 5px 0 var(--ink); }
      .finish-icon { width: 54px; height: 54px; display: grid; place-items: center; flex: 0 0 54px; border-radius: 16px; background: var(--ink); color: #fff; font-size: 1.5rem; }
      .finish p, .finish h2, .finish span { margin: 0; }
      .finish p { font-size: .7rem; font-weight: 950; letter-spacing: .1em; text-transform: uppercase; }
      .finish h2 { margin: .1rem 0; }
      .finish span { font-size: .85rem; }
      .game-grid { display: grid; grid-template-columns: minmax(340px,.8fr) minmax(0,1.2fr); gap: 1.25rem; align-items: start; }
      .panel-head-space { margin-bottom: 1.25rem; }
      .score-list, .ranking { display: grid; gap: .68rem; margin: 0; padding: 0; list-style: none; }
      .score-row { min-width: 0; display: grid; grid-template-columns: auto minmax(0,1fr) 112px; align-items: center; gap: .8rem; padding: .55rem; border: 1px solid #e5e8eb; border-radius: 15px; }
      .score-row label { overflow: hidden; font-weight: 850; text-overflow: ellipsis; white-space: nowrap; }
      .score-input { position: relative; }
      .score-input input { height: 42px; border-radius: 10px; background: #f5f7f8; padding-right: 2.45rem; text-align: right; font-weight: 950; }
      .score-input span { position: absolute; right: .65rem; top: 50%; transform: translateY(-50%); color: #9aa5af; font-size: .64rem; font-weight: 850; }
      .save { width: 100%; min-height: 52px; margin-top: 1.2rem; font-size: 1rem; }
      .rank-row { display: grid; grid-template-columns: 25px auto minmax(0,1fr); align-items: center; gap: .85rem; border: 1px solid #e5e8eb; border-radius: 16px; padding: .8rem; }
      .rank-row:first-child { border-color: rgba(18,32,51,.35); background: linear-gradient(90deg,rgba(201,255,98,.18),transparent 60%); }
      .rank-row.reached { border: 2px solid var(--ink); }
      .rank-no { color: #8a96a1; font-size: .8rem; font-weight: 950; text-align: center; }
      .rank-main { min-width: 0; }
      .rank-line { display: flex; justify-content: space-between; gap: .75rem; margin-bottom: .55rem; }
      .rank-line strong { overflow: hidden; font-size: .9rem; text-overflow: ellipsis; white-space: nowrap; }
      .rank-line span { flex: 0 0 auto; font-weight: 950; }
      .rank-line small { color: #8a96a1; font-size: .63rem; }
      .track { height: 5px; overflow: hidden; border-radius: 999px; background: #e8ecef; }
      .track span { display: block; height: 100%; border-radius: inherit; transition: width .25s ease; }
      .history { margin-top: 1.25rem; overflow: hidden; }
      .history-head { margin-bottom: 1.25rem; }
      .table-wrap { width: 100%; overflow-x: auto; }
      table { width: 100%; min-width: 560px; border-collapse: collapse; font-size: .88rem; }
      th, td { border-bottom: 1px solid #e3e7ea; padding: .85rem 1rem; text-align: center; }
      th:first-child, td:first-child { text-align: left; }
      th { background: #f2f4f5; color: #607084; font-size: .71rem; font-weight: 950; }
      td { font-weight: 800; }
      tfoot { background: var(--ink); color: #fff; }
      tfoot td { border: 0; }
      .round-cell { color: #7c8996; font-size: .74rem; font-weight: 950; }
      .empty-history { min-height: 130px; }
      .toast { position: fixed; z-index: 20; top: 1rem; left: 50%; transform: translate(-50%,-140%); max-width: calc(100% - 2rem); border: 1px solid rgba(18,32,51,.15); border-radius: 13px; background: var(--ink); color: #fff; padding: .8rem 1rem; box-shadow: 0 12px 35px rgba(18,32,51,.25); font-size: .86rem; font-weight: 800; opacity: 0; transition: .25s ease; }
      .toast.show { transform: translate(-50%,0); opacity: 1; }

      @media (max-width: 860px) {
        .grid, .game-grid { grid-template-columns: 1fr; }
        .game-head { align-items: flex-start; flex-direction: column; }
        .game-actions { justify-content: flex-start; }
      }
      @media (max-width: 600px) {
        .header-inner, .shell { width: min(100% - 1.1rem,1180px); }
        .header-inner { min-height: 62px; }
        .brand { font-size: .71rem; }
        .round-pill { padding: .42rem .62rem; font-size: .67rem; }
        h1 { letter-spacing: -.055em; }
        .panel { padding: 1rem; border-radius: 19px; }
        .add-form { grid-template-columns: 1fr; }
        .game-actions, .history-actions { width: 100%; }
        .game-actions > *, .history-actions > * { flex: 1; }
        .limit-badge { justify-content: center; }
        .finish { align-items: flex-start; }
        .finish-icon { width: 44px; height: 44px; flex-basis: 44px; border-radius: 13px; }
        .score-row { grid-template-columns: auto minmax(0,1fr) 92px; gap: .6rem; }
        .avatar { width: 34px; height: 34px; }
        .history-head { align-items: flex-start; flex-direction: column; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="app"></div>

    <script>
      const COLORS = ["#c9ff62", "#75e7ff", "#ffb15a", "#ff7d9c", "#bba5ff", "#f5dd62", "#68d6ae", "#f58bff"];
      const state = { phase: "setup", players: [], mode: "limit", limit: 100, rounds: [] };
      const app = document.querySelector("#app");
      const toastNode = document.querySelector("#toast");
      let toastTimer;

      const escapeHtml = (value) => String(value).replace(/[&<>'"]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[char]));
      const initials = (name) => name.trim().split(/\s+/).slice(0, 2).map(part => part[0]).join("").toUpperCase();
      const format = (number) => new Intl.NumberFormat("es-CL").format(number);
      const uid = () => crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;

      function showToast(message) {
        clearTimeout(toastTimer);
        toastNode.textContent = message;
        toastNode.classList.add("show");
        toastTimer = setTimeout(() => toastNode.classList.remove("show"), 2600);
      }

      function totals() {
        return state.players.reduce((result, player) => {
          result[player.id] = state.rounds.reduce((sum, round) => sum + (round.scores[player.id] || 0), 0);
          return result;
        }, {});
      }

      function ranking() {
        const scoreTotals = totals();
        return state.players
          .map((player, index) => ({ ...player, originalIndex: index, total: scoreTotals[player.id] || 0 }))
          .sort((a, b) => b.total - a.total || a.originalIndex - b.originalIndex);
      }

      function avatar(player) {
        return `<span class="avatar" style="background:${player.color}">${escapeHtml(initials(player.name))}</span>`;
      }

      function layout(content, roundText) {
        return `
          <header class="header">
            <div class="header-inner">
              <div class="brand"><span class="brand-dot" aria-hidden="true"></span> MARCADOR</div>
              <div class="round-pill">⚑ ${roundText}</div>
            </div>
          </header>
          ${content}`;
      }

      function setupTemplate() {
        const playersHtml = state.players.length
          ? state.players.map((player, index) => `
              <div class="player">
                ${avatar(player)}
                <span class="player-name">${escapeHtml(player.name)}</span>
                <span class="player-number">#${String(index + 1).padStart(2,"0")}</span>
                <button class="remove" type="button" data-remove="${player.id}" aria-label="Quitar a ${escapeHtml(player.name)}">✕</button>
              </div>`).join("")
          : `<div class="empty"><span aria-hidden="true">◎</span><strong>Aún no hay participantes.</strong><span>Agrega al menos 2 para comenzar.</span></div>`;

        return layout(`
          <main class="shell">
            <div class="heading">
              <p class="eyebrow">✦ Todo listo para jugar</p>
              <h1>Una ronda a la vez.</h1>
              <p>Agrega a quienes juegan y elige cómo se definirá la partida.</p>
            </div>
            <div class="grid">
              <section class="panel" aria-labelledby="players-title">
                <div class="panel-head">
                  <div><p class="step">PASO 01</p><h2 id="players-title">Participantes</h2></div>
                  <span class="badge count">${state.players.length}/12</span>
                </div>
                <form id="add-player" class="add-form">
                  <label class="sr-only" for="player-name">Nombre del participante</label>
                  <input id="player-name" maxlength="28" autocomplete="off" placeholder="Escribe un nombre" />
                  <button class="btn" type="submit">＋ Agregar</button>
                </form>
                <div class="player-list" aria-live="polite">${playersHtml}</div>
              </section>
              <section class="panel limit-panel" aria-labelledby="limit-title">
                <div><p class="step">PASO 02</p><h2 id="limit-title">Modo de puntuación</h2><p class="copy">Selecciona cómo quieres llevar el resultado de la partida.</p></div>
                <div class="mode-options" role="radiogroup" aria-label="Modo de puntuación">
                  <label class="mode-option"><input type="radio" name="mode" value="limit" ${state.mode === "limit" ? "checked" : ""} /><span><strong>Con puntaje tope</strong><small>La partida se detiene al alcanzar el límite.</small></span></label>
                  <label class="mode-option"><input type="radio" name="mode" value="cumulative" ${state.mode === "cumulative" ? "checked" : ""} /><span><strong>Acumulativo</strong><small>Se suman las rondas y quien tiene más puntos va ganando.</small></span></label>
                </div>
                ${state.mode === "limit" ? `<div>
                    <label class="limit-label" for="limit">Límite de la partida</label>
                    <div class="limit-wrap"><input id="limit" type="number" inputmode="numeric" min="1" step="1" value="${state.limit}" /><span>PTS</span></div>
                    <p class="help">Puedes cambiarlo antes de iniciar.</p>
                  </div>` : `<div class="cumulative-note" role="note"><span aria-hidden="true">♛</span><div><strong>Sin límite automático</strong><small>Agrega todas las rondas que necesites. La clasificación mostrará el mayor puntaje.</small></div></div>`}
                <button id="start" class="btn start" type="button">Comenzar partida →</button>
              </section>
            </div>
          </main>`, "Nueva partida");
      }

      function gameTemplate() {
        const scoreTotals = totals();
        const ordered = ranking();
        const leaderScore = ordered[0]?.total || 0;
        const reached = state.mode === "limit" ? ordered.filter(player => player.total >= state.limit) : [];
        const finished = state.mode === "limit" && reached.length > 0;
        const scoreRows = state.players.map(player => `
          <div class="score-row">
            ${avatar(player)}
            <label for="score-${player.id}">${escapeHtml(player.name)}</label>
            <div class="score-input">
              <input id="score-${player.id}" data-score="${player.id}" type="number" inputmode="numeric" step="1" placeholder="0" ${finished ? "disabled" : ""} />
              <span>pts</span>
            </div>
          </div>`).join("");
        const ranks = ordered.map((player, index) => {
          const percent = state.mode === "limit" ? Math.max(0, Math.min(100, player.total / state.limit * 100)) : leaderScore > 0 ? Math.max(0, Math.min(100, player.total / leaderScore * 100)) : 0;
          const progressLabel = state.mode === "limit" ? `${escapeHtml(player.name)}: ${Math.round(percent)}% del tope` : `${escapeHtml(player.name)}: ${format(player.total)} puntos acumulados`;
          return `<li class="rank-row ${state.mode === "limit" && player.total >= state.limit ? "reached" : ""}">
            <span class="rank-no">${index + 1}</span>${avatar(player)}
            <div class="rank-main"><div class="rank-line"><strong>${escapeHtml(player.name)}</strong><span>${format(player.total)} <small>pts</small></span></div>
            <div class="track" role="progressbar" aria-label="${progressLabel}" aria-valuenow="${Math.round(percent)}" aria-valuemin="0" aria-valuemax="100"><span style="width:${percent}%;background:${player.color}"></span></div></div>
          </li>`;
        }).join("");
        const history = state.rounds.length
          ? `<div class="table-wrap"><table><thead><tr><th>Ronda</th>${state.players.map(p => `<th>${escapeHtml(p.name)}</th>`).join("")}</tr></thead>
             <tbody>${state.rounds.map((round, index) => `<tr><td class="round-cell">#${String(index+1).padStart(2,"0")}</td>${state.players.map(p => `<td>${format(round.scores[p.id] || 0)}</td>`).join("")}</tr>`).join("")}</tbody>
             <tfoot><tr><td>Total</td>${state.players.map(p => `<td>${format(scoreTotals[p.id] || 0)}</td>`).join("")}</tr></tfoot></table></div>`
          : `<div class="empty empty-history"><span>⚑</span><strong>La primera ronda aparecerá aquí.</strong></div>`;

        return layout(`
          <main class="shell game-shell">
            <div class="game-head">
              <div><p class="eyebrow">♛ Partida en curso</p><h1>Puntaje de la partida</h1></div>
              <div class="game-actions"><div class="limit-badge ${state.mode === "cumulative" ? "cumulative" : ""}">${state.mode === "limit" ? `<span>TOPE</span>${format(state.limit)} pts` : `<span>MODO</span>Acumulativo · mayor gana`}</div><button id="new-game" class="btn btn-secondary" type="button">↻ Nueva partida</button></div>
            </div>
            ${finished ? `<div class="finish" role="status"><div class="finish-icon">♛</div><div><p>¡Puntaje tope alcanzado!</p><h2>${reached.map(p => escapeHtml(p.name)).join(" y ")}</h2><span>La partida llegó a su límite. Puedes revisar o deshacer la última ronda.</span></div></div>` : ""}
            <div class="game-grid">
              <section class="panel" aria-labelledby="round-title">
                <div class="panel-head panel-head-space"><div><p class="step">RONDA ${String(state.rounds.length+1).padStart(2,"0")}</p><h2 id="round-title">Agregar puntos</h2></div><span class="badge">Vacío = 0</span></div>
                <form id="round-form"><div class="score-list">${scoreRows}</div><button class="btn save" type="submit" ${finished ? "disabled" : ""}>＋ Guardar ronda</button></form>
              </section>
              <section class="panel" aria-labelledby="ranking-title">
                <div class="panel-head panel-head-space"><div><p class="step">EN VIVO</p><h2 id="ranking-title">Clasificación</h2></div><span aria-hidden="true">◎</span></div>
                <ol class="ranking">${ranks}</ol>
              </section>
            </div>
            <section class="panel history" aria-labelledby="history-title">
              <div class="history-head"><div><p class="step">REGISTRO</p><h2 id="history-title">Historial de rondas</h2></div>
                <div class="history-actions"><button id="undo" class="btn btn-ghost" type="button" ${state.rounds.length ? "" : "disabled"}>↶ Deshacer última</button><button id="setup" class="btn btn-ghost" type="button">◎ Cambiar participantes</button></div>
              </div>${history}
            </section>
          </main>`, `Ronda ${state.rounds.length + 1}`);
      }

      function render() {
        app.innerHTML = state.phase === "setup" ? setupTemplate() : gameTemplate();
        state.phase === "setup" ? bindSetup() : bindGame();
      }

      function bindSetup() {
        document.querySelector("#add-player").addEventListener("submit", event => {
          event.preventDefault();
          const input = document.querySelector("#player-name");
          const name = input.value.trim();
          if (!name) return showToast("Escribe un nombre para agregar a la persona.");
          if (state.players.some(player => player.name.toLowerCase() === name.toLowerCase())) return showToast("Ese nombre ya está en la lista.");
          if (state.players.length >= 12) return showToast("Puedes agregar hasta 12 participantes.");
          state.players.push({ id: uid(), name, color: COLORS[state.players.length % COLORS.length] });
          render();
          document.querySelector("#player-name").focus();
        });
        document.querySelectorAll("[data-remove]").forEach(button => button.addEventListener("click", () => {
          state.players = state.players.filter(player => player.id !== button.dataset.remove);
          render();
        }));
        document.querySelectorAll('[name="mode"]').forEach(input => input.addEventListener("change", event => {
          state.mode = event.target.value;
          render();
        }));
        document.querySelector("#limit")?.addEventListener("input", event => state.limit = Number(event.target.value));
        document.querySelector("#start").addEventListener("click", () => {
          const limit = state.mode === "limit" ? Number(document.querySelector("#limit").value) : state.limit;
          if (state.players.length < 2) return showToast("Agrega al menos 2 participantes.");
          if (state.mode === "limit" && (!Number.isFinite(limit) || limit <= 0)) return showToast("Ingresa un puntaje tope mayor que 0.");
          state.limit = limit;
          state.rounds = [];
          state.phase = "game";
          render();
        });
      }

      function bindGame() {
        document.querySelector("#round-form").addEventListener("submit", event => {
          event.preventDefault();
          const before = totals();
          const scores = {};
          document.querySelectorAll("[data-score]").forEach(input => {
            const value = input.value.trim() === "" ? 0 : Number(input.value);
            scores[input.dataset.score] = Number.isFinite(value) ? value : 0;
          });
          const reached = state.mode === "limit" ? state.players.filter(player => (before[player.id] || 0) < state.limit && (before[player.id] || 0) + scores[player.id] >= state.limit) : [];
          state.rounds.push({ id: uid(), scores });
          render();
          showToast(reached.length ? `${reached.map(p => p.name).join(" y ")} alcanzó el tope.` : `Ronda ${state.rounds.length} guardada.`);
        });
        document.querySelector("#undo").addEventListener("click", () => {
          if (!state.rounds.length) return;
          state.rounds.pop();
          render();
          showToast("Se eliminó la última ronda.");
        });
        document.querySelector("#new-game").addEventListener("click", () => {
          if (!state.rounds.length || confirm("¿Iniciar una nueva partida? Se eliminarán las rondas actuales.")) {
            state.rounds = [];
            render();
            showToast("Nueva partida lista.");
          }
        });
        document.querySelector("#setup").addEventListener("click", () => {
          if (!state.rounds.length || confirm("¿Cambiar participantes? Se eliminarán las rondas actuales.")) {
            state.rounds = [];
            state.phase = "setup";
            render();
          }
        });
      }

      render();
    </script>
  </body>
</html>
